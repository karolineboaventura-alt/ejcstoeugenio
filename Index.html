<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistema Financeiro • EJC 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#f8fafc;font-family:sans-serif;}
    .card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,.08);}
    .btn{padding:12px;border-radius:12px;font-weight:bold;transition:0.2s;}
    .btn:active{transform:scale(0.98);}
    .hidden{display:none;}
  </style>
</head>
<body>

<div id="loginScreen" class="fixed inset-0 flex items-center justify-center bg-purple-900 z-50">
  <div class="card w-full max-w-sm mx-4">
    <h1 class="text-2xl font-extrabold text-center mb-4 text-purple-900">💜 Financeiro EJC</h1>
    <input id="passwordInput" type="password" placeholder="Senha" class="w-full border p-3 rounded-xl mb-3 outline-none focus:border-purple-500"/>
    <button onclick="loginAdmin()" class="btn w-full bg-purple-700 text-white mb-2 shadow-lg">👑 Pilotos</button>
    <button onclick="loginCompras()" class="btn w-full bg-green-600 text-white shadow-lg">🛒 Compras</button>
    <p id="loginError" class="hidden text-red-600 font-bold text-center mt-3 bg-red-100 p-2 rounded">Senha incorreta</p>
  </div>
</div>

<div id="loading" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center">
    <div class="bg-white p-5 rounded-xl shadow-xl flex flex-col items-center">
        <div class="w-8 h-8 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin mb-2"></div>
        <span class="font-bold text-gray-700">Salvando...</span>
    </div>
</div>

<div id="app" class="hidden p-4 space-y-6 max-w-xl mx-auto">
  <header class="flex justify-between items-center mb-4">
      <h2 id="tituloPainel" class="text-xl font-extrabold text-gray-800"></h2>
      <button onclick="location.reload()" class="text-sm text-red-500 font-bold bg-white px-3 py-1 rounded shadow">Sair</button>
  </header>

  <div class="card space-y-3 border-l-4 border-green-500">
    <h3 class="font-bold text-lg text-gray-800 flex items-center gap-2">➕ Registrar Venda</h3>

    <div class="grid grid-cols-2 gap-2">
        <input id="produto" placeholder="Produto (Ex: Marmita)" class="w-full border p-3 rounded-lg outline-none focus:border-green-500"/>
        <input id="valor" type="number" step="0.01" placeholder="Valor (R$)" class="w-full border p-3 rounded-lg outline-none focus:border-green-500 font-bold"/>
    </div>

    <select id="categoria" class="w-full border p-3 rounded-lg bg-white" onchange="toggleCamposEJC()">
      <option value="EJC">⛪ EJC</option>
      <option value="DiaDasMaes">🌸 Mercadinho Mães</option>
      <option value="DiaDosNamorados">💘 Mercadinho Namorados</option>
      <option value="Feijoada">🍲 Feijoada</option>
      <option value="Outros">📦 Outros</option>
    </select>

    <div id="boxDiaEJC">
        <select id="ejcDia" class="w-full border p-3 rounded-lg bg-white">
          <option value="Sexta">Sexta</option>
          <option value="Sabado">Sábado</option>
          <option value="Domingo">Domingo</option>
        </select>
    </div>

    <select id="statusPago" class="w-full border p-3 rounded-lg bg-white font-bold text-gray-700" onchange="toggleDevedor()">
      <option value="true">✅ Pago na Hora</option>
      <option value="false">⚠️ Devendo (Fiado)</option>
    </select>

    <div id="boxDevedor" class="hidden p-3 bg-yellow-50 rounded-lg border border-yellow-200">
        <label class="text-xs font-bold text-yellow-700 uppercase">Dados para Cobrança</label>
        <input id="equipeDevedora" placeholder="Nome da Equipe / Pessoa" class="w-full border p-2 rounded mt-1"/>
    </div>

    <div id="boxPagamento" class="p-3 bg-green-50 rounded-lg border border-green-200">
        <label class="text-xs font-bold text-green-700 uppercase">Recebimento</label>
        <div class="flex gap-2 mt-1">
            <select id="formaPagamento" class="w-1/2 border p-2 rounded">
              <option value="PIX">PIX</option>
              <option value="Dinheiro">Dinheiro</option>
              <option value="Cartao">Cartão</option>
            </select>
            <input id="responsible" placeholder="Quem recebeu?" class="w-1/2 border p-2 rounded"/>
        </div>
    </div>

    <button onclick="salvarVenda()" class="btn w-full bg-green-600 hover:bg-green-700 text-white shadow-lg text-lg">
      💾 Salvar
    </button>
  </div>

  <div class="card border-l-4 border-yellow-500">
    <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-gray-800">⚠️ Pendências / Devedores</h3>
        <button onclick="carregarPendencias()" class="text-xs bg-gray-100 px-2 py-1 rounded hover:bg-gray-200">🔄 Atualizar</button>
    </div>
    <div id="pendencias" class="space-y-3">
        <p class="text-center text-gray-400 py-4">Carregando...</p>
    </div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
// Link da sua API (SEU SCRIPT)
const API_URL = "https://script.google.com/macros/s/AKfycbzxKh6wEaKatDBMvZ45ac9tnC5FxBzyTrnq42-wH92QmWPqUK8c_qH4vEVLDrBGQyinkg/exec";

const PASS_ADMIN = "@admpilotosejc2026#";
const PASS_COMPRAS = "$compras2026";

let role = "";

/* ================= LOGIN ================= */
function loginAdmin() {
  if(document.getElementById('passwordInput').value === PASS_ADMIN) {
    role = "admin";
    iniciar();
  } else erro();
}

function loginCompras() {
  if(document.getElementById('passwordInput').value === PASS_COMPRAS) {
    role = "compras";
    iniciar();
  } else erro();
}

function erro() {
  const err = document.getElementById('loginError');
  err.classList.remove("hidden");
  setTimeout(() => err.classList.add("hidden"), 2000);
}

function iniciar() {
  document.getElementById('loginScreen').classList.add("hidden");
  document.getElementById('app').classList.remove("hidden");
  document.getElementById('tituloPainel').innerText = role === "admin" ? "👑 Pilotos" : "🛒 Compras";
  carregarPendencias();
}

/* ================= UI UTILS ================= */
function toggleCamposEJC() {
    const isEJC = document.getElementById('categoria').value === 'EJC';
    document.getElementById('boxDiaEJC').classList.toggle('hidden', !isEJC);
}

function toggleDevedor() {
    const isPago = document.getElementById('statusPago').value === "true";
    document.getElementById('boxPagamento').classList.toggle('hidden', !isPago);
    document.getElementById('boxDevedor').classList.toggle('hidden', isPago);
}

function toggleLoading(show) {
    document.getElementById('loading').classList.toggle('hidden', !show);
}

/* ================= LOAD ================= */
async function carregarPendencias() {
  try {
      const res = await fetch(API_URL + "?action=listarCompras&t=" + new Date().getTime());
      const data = await res.json();
      
      // Filtrar apenas pendentes
      const pend = data.filter(x => x.paid === false);
      const div = document.getElementById('pendencias');
      
      div.innerHTML = "";

      if(pend.length === 0) {
        div.innerHTML = "<div class='text-center text-gray-400'>🎉 Nenhuma pendência!</div>";
        return;
      }

      pend.forEach(p => {
        div.innerHTML += `
          <div class="flex justify-between items-center bg-yellow-50 p-3 rounded-lg border border-yellow-100">
            <div>
              <b class="text-gray-800">${p.equipe_devedora || 'Sem Nome'}</b>
              <p class="text-xs text-gray-500">${p.description} • R$ ${parseFloat(p.amount).toFixed(2)}</p>
            </div>
            <button onclick="darBaixa('${p.id}')" class="bg-green-500 text-white px-3 py-1 rounded-lg text-xs font-bold shadow hover:bg-green-600">
              Receber
            </button>
          </div>
        `;
      });
  } catch (e) {
      console.error(e);
      document.getElementById('pendencias').innerHTML = "<p class='text-red-500 text-center'>Erro ao carregar.</p>";
  }
}

/* ================= SALVAR VENDA (POST) ================= */
async function salvarVenda() {
  const prod = document.getElementById('produto').value;
  const val = document.getElementById('valor').value;
  
  if(!prod || !val) {
      alert("Preencha Produto e Valor!");
      return;
  }

  toggleLoading(true);

  const isPago = document.getElementById('statusPago').value === "true";

  const payload = {
    date: new Date().toISOString(),
    type: "Entrada",
    category: document.getElementById('categoria').value,
    description: prod,
    produto: prod,
    quantidade: 1,
    valor_unitario: val, // Campo extra para segurança
    amount: val,
    buyer_name: isPago ? "-" : document.getElementById('equipeDevedora').value, // Nome de quem deve
    buyer_phone: "",
    responsible: role === 'admin' ? "Admin" : "Compras",
    paid: isPago,
    paid_date: isPago ? new Date().toISOString() : "",
    forma_pagamento: isPago ? document.getElementById('formaPagamento').value : "",
    received_by: isPago ? document.getElementById('responsible').value : "",
    equipe_devedora: isPago ? "-" : document.getElementById('equipeDevedora').value,
    ejc_dia: document.getElementById('categoria').value === 'EJC' ? document.getElementById('ejcDia').value : ""
  };

  try {
      // Usamos no-cors para evitar erro de bloqueio do Google e assumimos sucesso
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          action: "criarVendaCompras",
          payload: payload
        })
      });

      // Limpar campos
      document.getElementById('produto').value = "";
      document.getElementById('valor').value = "";
      document.getElementById('equipeDevedora').value = "";
      
      alert("✅ Venda Registrada com Sucesso!");
      
      // Esperar um pouco pro Google processar antes de recarregar
      setTimeout(() => {
          toggleLoading(false);
          carregarPendencias();
      }, 1500);

  } catch (e) {
      toggleLoading(false);
      alert("Erro ao salvar: " + e);
  }
}

/* ================= DAR BAIXA (UPDATE) ================= */
async function darBaixa(id) {
  const forma = prompt("Forma de pagamento? (PIX / Dinheiro)");
  if(!forma) return;
  
  const quem = prompt("Quem recebeu o valor?");
  if(!quem) return;

  toggleLoading(true);

  try {
      await fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          action: "marcarPago",
          payload: {
            id: id,
            forma_pagamento: forma,
            received_by: quem
          }
        })
      });

      alert("✅ Baixa realizada!");
      setTimeout(() => {
          toggleLoading(false);
          carregarPendencias();
      }, 1500);

  } catch (e) {
      toggleLoading(false);
      alert("Erro na baixa.");
  }
}
</script>

</body>
</html>

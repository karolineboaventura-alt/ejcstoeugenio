<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Sistema Financeiro • EJC 2026</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{background:#f8fafc;font-family:sans-serif;}
    .card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,.08);}
    .btn{padding:12px;border-radius:12px;font-weight:bold;}
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="fixed inset-0 flex items-center justify-center bg-purple-900">

  <div class="card w-full max-w-sm">

    <h1 class="text-2xl font-extrabold text-center mb-4">
      💜 Sistema Financeiro EJC
    </h1>

    <input id="passwordInput" type="password"
      placeholder="Senha"
      class="w-full border p-3 rounded-xl mb-3"/>

    <button onclick="loginAdmin()"
      class="btn w-full bg-purple-700 text-white mb-2">
      👑 Pilotos
    </button>

    <button onclick="loginCompras()"
      class="btn w-full bg-green-600 text-white">
      🛒 Compras
    </button>

    <p id="loginError" class="hidden text-red-600 font-bold text-center mt-3">
      Senha errada
    </p>

  </div>
</div>

<!-- APP -->
<div id="app" class="hidden p-6 space-y-6 max-w-xl mx-auto">

  <h2 id="tituloPainel" class="text-xl font-extrabold"></h2>

  <!-- FORM -->
  <div class="card space-y-3">

    <h3 class="font-bold">➕ Nova Venda</h3>

    <input id="produto" placeholder="Produto"
      class="w-full border p-2 rounded"/>

    <input id="valor" type="number" placeholder="Valor total"
      class="w-full border p-2 rounded"/>

    <select id="categoria" class="w-full border p-2 rounded">
      <option value="EJC">⛪ EJC</option>
      <option value="DiaDasMaes">🌸 Mercadinho Dia das Mães</option>
      <option value="DiaDosNamorados">💘 Mercadinho Namorados</option>
      <option value="Outros">📦 Outros</option>
      <option value="Feijoada">🍲 Feijoada</option>
    </select>

    <select id="ejcDia" class="w-full border p-2 rounded">
      <option value="">Dia do EJC (se for EJC)</option>
      <option value="Sexta">Sexta</option>
      <option value="Sabado">Sábado</option>
      <option value="Domingo">Domingo</option>
    </select>

    <input id="buyerName" placeholder="Nome comprador"
      class="w-full border p-2 rounded"/>

    <input id="buyerPhone" placeholder="Telefone comprador"
      class="w-full border p-2 rounded"/>

    <input id="responsible" placeholder="Quem vendeu"
      class="w-full border p-2 rounded"/>

    <select id="formaPagamento" class="w-full border p-2 rounded">
      <option value="PIX">PIX</option>
      <option value="Dinheiro">Dinheiro</option>
      <option value="Debito">Débito</option>
      <option value="Credito">Crédito</option>
    </select>

    <select id="statusPago" class="w-full border p-2 rounded">
      <option value="true">✅ Pago</option>
      <option value="false">⚠️ Devendo</option>
    </select>

    <input id="equipeDevedora" placeholder="Equipe (se devendo)"
      class="w-full border p-2 rounded"/>

    <button onclick="salvarVenda()"
      class="btn w-full bg-green-600 text-white">
      💾 Salvar Venda
    </button>

  </div>

  <!-- PENDÊNCIAS -->
  <div class="card">
    <h3 class="font-bold mb-2">⚠️ Pendências</h3>
    <div id="pendencias"></div>
  </div>

</div>

<script>
/* ================= CONFIG ================= */

const API_URL="https://script.google.com/macros/s/AKfycbzxKh6wEaKatDBMvZ45ac9tnC5FxBzyTrnq42-wH92QmWPqUK8c_qH4vEVLDrBGQyinkg/exec";

const PASS_ADMIN="@admpilotosejc2026#";
const PASS_COMPRAS="$compras2026";

let role="";
let comprasData=[];

/* ================= LOGIN ================= */

function loginAdmin(){
  if(passwordInput.value===PASS_ADMIN){
    role="admin";
    iniciar();
  } else erro();
}

function loginCompras(){
  if(passwordInput.value===PASS_COMPRAS){
    role="compras";
    iniciar();
  } else erro();
}

function erro(){
  loginError.classList.remove("hidden");
}

/* ================= START ================= */

async function iniciar(){
  loginScreen.classList.add("hidden");
  app.classList.remove("hidden");

  tituloPainel.innerText =
    role==="admin" ? "👑 Painel Pilotos (Total)" : "🛒 Painel Compras";

  await carregarPendencias();
}

/* ================= LOAD ================= */

async function carregarPendencias(){
  comprasData = await (await fetch(API_URL+"?action=listarCompras")).json();

  let pend = comprasData.filter(x=>x.paid===false);

  pendencias.innerHTML="";

  if(pend.length===0){
    pendencias.innerHTML="🎉 Nenhuma pendência!";
    return;
  }

  pend.forEach(p=>{
    pendencias.innerHTML+=`
      <div class="border-b py-2 flex justify-between">
        <div>
          <b>${p.description}</b><br>
          <span class="text-xs text-red-600">
            ${p.equipe_devedora}
          </span>
        </div>
        <button onclick="darBaixa('${p.id}')"
          class="btn bg-red-600 text-white text-xs">
          Receber
        </button>
      </div>
    `;
  });
}

/* ================= SALVAR VENDA ================= */

async function salvarVenda(){

  let payload={

    /* ORDEM EXATA DO SEU SHEET COMPRAS */

    date: new Date().toISOString(),
    type:"Entrada",
    category: categoria.value,
    description: produto.value,

    produto: produto.value,
    quantidade: 1,
    valor_unitario: "",

    amount: valor.value,

    buyer_name: buyerName.value,
    buyer_phone: buyerPhone.value,

    responsible: responsible.value,

    paid: statusPago.value==="true",

    paid_date: "",
    forma_pagamento: formaPagamento.value,
    received_by: responsible.value,

    equipe_devedora: equipeDevedora.value,
    ejc_dia: ejcDia.value
  };

  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      action:"criarVendaCompras",
      payload
    })
  });

  alert("✅ Venda salva!");

  await carregarPendencias();
}

/* ================= DAR BAIXA ================= */

async function darBaixa(id){

  let forma = prompt("Forma pagamento?");
  let recebido = prompt("Quem recebeu?");

  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      action:"marcarPago",
      payload:{
        id,
        forma_pagamento:forma,
        received_by:recebido
      }
    })
  });

  alert("✅ Baixa registrada!");
  await carregarPendencias();
}

</script>

</body>
</html>

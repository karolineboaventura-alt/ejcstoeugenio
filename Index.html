<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EJC BANK 6.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Montserrat:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f0f2f5; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .tab-active { border-bottom: 4px solid #10b981; color: #10b981; font-weight: 800; }
        .day-active { background-color: #10b981; color: white; border-color: #10b981; }
        .hidden { display: none; }
    </style>
</head>
<body class="text-slate-800">

    <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-[200] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl text-center">
            <div class="bg-purple-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6"><i class="fas fa-landmark text-4xl text-purple-700"></i></div>
            <h1 class="text-3xl font-black text-slate-800 mb-2 uppercase font-mono">EJC BANK</h1>
            <p class="text-slate-500 mb-8 text-sm">Sistema Seguro • 21º EJC</p>
            <div class="space-y-4">
                <button onclick="iniciarLogin('admin')" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-3"><i class="fas fa-crown"></i> PILOTOS FINANÇAS</button>
                <button onclick="iniciarLogin('compras')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-3"><i class="fas fa-shopping-cart"></i> EQUIPE DE COMPRAS</button>
            </div>
        </div>
    </div>

    <header class="bg-gradient-to-r from-slate-900 via-purple-900 to-slate-900 text-white p-4 md:p-6 shadow-2xl sticky top-0 z-50 border-b-4 border-emerald-500 hidden" id="appHeader">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <div class="bg-white/5 p-3 rounded-2xl backdrop-blur-sm border border-white/10"><i class="fas fa-landmark text-3xl text-emerald-400"></i></div>
                <div><h1 class="text-2xl md:text-3xl font-black tracking-tighter uppercase font-mono leading-none">EJC <span class="text-emerald-400">BANK</span></h1><span id="userBadge" class="text-[10px] font-bold bg-white/10 px-2 py-1 rounded text-purple-200 uppercase tracking-widest mt-1 inline-block"></span></div>
            </div>
            <div class="flex flex-wrap gap-2 justify-end">
                <button onclick="exportarExcel()" class="bg-slate-700 hover:bg-green-700 text-white p-2 rounded-lg text-xs font-bold btn-export"><i class="fas fa-file-excel"></i></button>
                <button onclick="exportarPDF()" class="bg-slate-700 hover:bg-red-700 text-white p-2 rounded-lg text-xs font-bold btn-export"><i class="fas fa-file-pdf"></i></button>
                <button onclick="mudarAba('arquivo')" id="tab-arquivo" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl font-bold text-xs border border-slate-600 btn-arquivo"><i class="fas fa-box-archive"></i> Arquivo</button>
                <button onclick="abrirModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-xl font-bold shadow-lg flex items-center gap-2 border border-emerald-400"><i class="fas fa-plus-circle text-lg"></i> <span>NOVO</span></button>
                <button onclick="sair()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl font-bold text-xs"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 hidden" id="appMain">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-emerald-500"><p class="text-xs font-bold text-slate-400 uppercase">Recebido</p><h2 id="totEntradas" class="text-3xl font-black text-slate-800 mt-2 font-mono">R$ 0,00</h2></div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-rose-500"><p class="text-xs font-bold text-slate-400 uppercase">Saídas/Pend.</p><h2 id="totSaidas" class="text-3xl font-black text-rose-600 mt-2 font-mono">R$ 0,00</h2></div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border-l-8 border-indigo-600"><p class="text-xs font-bold text-slate-400 uppercase">Saldo</p><h2 id="totSaldo" class="text-3xl font-black text-indigo-800 mt-2 font-mono">R$ 0,00</h2></div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-2 mb-4 flex gap-2 overflow-x-auto border border-slate-200" id="barraAbas">
            <button id="tab-admin" onclick="mudarAba('admin')" class="flex-1 py-3 px-4 rounded-lg font-bold text-sm text-slate-500 hover:bg-slate-50"><i class="fas fa-briefcase"></i> ADMIN</button>
            <button id="tab-compras" onclick="mudarAba('compras')" class="flex-1 py-3 px-4 rounded-lg font-bold text-sm text-slate-500 hover:bg-slate-50"><i class="fas fa-shopping-cart"></i> MERCADINHO</button>
            <button id="tab-feijoada" onclick="mudarAba('feijoada')" class="flex-1 py-3 px-4 rounded-lg font-bold text-sm text-slate-500 hover:bg-slate-50"><i class="fas fa-utensils"></i> FEIJOADA</button>
        </div>
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
            <div id="painelDias" class="hidden flex bg-white p-1 rounded-xl shadow-sm border border-slate-200">
                <button onclick="filtrarDia('Todos')" id="day-Todos" class="px-4 py-2 rounded-lg text-xs font-bold day-active">Todos</button>
                <button onclick="filtrarDia('Sexta')" id="day-Sexta" class="px-4 py-2 rounded-lg text-xs font-bold text-slate-500">Sexta</button>
                <button onclick="filtrarDia('Sabado')" id="day-Sabado" class="px-4 py-2 rounded-lg text-xs font-bold text-slate-500">Sábado</button>
                <button onclick="filtrarDia('Domingo')" id="day-Domingo" class="px-4 py-2 rounded-lg text-xs font-bold text-rose-500 border border-transparent hover:border-rose-200 flex items-center gap-1"><i class="fas fa-exclamation-circle"></i> Domingo</button>
            </div>
            <select id="filtroEquipe" onchange="renderizarTabela()" class="w-full md:w-48 px-3 py-2 rounded-xl border border-slate-200 text-sm font-bold text-slate-600 outline-none focus:border-purple-500"><option value="">Todas as Equipes</option><option>Animação</option><option>Apoio ao Patrimônio</option><option>Café</option><option>Casal Coordenador Geral</option><option>Círculo</option><option>Compras</option><option>Cozinha</option><option>Intercessão</option><option>Liturgia</option><option>Ordem</option><option>Piloto</option><option>Sala</option><option>Secretaria</option><option>Som e Iluminação</option><option>Trânsito</option><option>Visitação</option></select>
            <div class="relative w-full md:w-64"><i class="fas fa-search absolute left-3 top-3 text-slate-400"></i><input type="text" id="campoBusca" onkeyup="filtrarBusca()" placeholder="Buscar..." class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:border-purple-500 text-sm"></div>
        </div>
        <div id="areaCobranca" class="hidden mb-8 space-y-4"><div class="bg-rose-50 border-l-4 border-rose-500 p-4 rounded-r-xl flex justify-between items-center"><div><h3 class="font-black text-rose-700 uppercase"><i class="fas fa-bullhorn"></i> Modo Cobrança</h3><p class="text-xs text-rose-600">Domingo Turbo Ativo</p></div></div><div id="top5Resumo" class="bg-white border border-rose-100 p-4 rounded-xl shadow-sm hidden"></div><div id="listaDevedores" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div></div>
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200 min-h-[400px] relative"><div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead class="bg-slate-50 border-b border-slate-200 text-xs font-bold uppercase text-slate-500"><tr><th class="p-4">Data</th><th class="p-4">Descrição</th><th class="p-4 text-right">Valor</th><th class="p-4 text-center">Status</th><th class="p-4 text-center">Ações</th></tr></thead><tbody id="corpoTabela" class="divide-y divide-slate-100 text-sm font-medium text-slate-700"></tbody></table></div><div id="loading" class="absolute inset-0 bg-white/80 flex flex-col items-center justify-center z-10 hidden backdrop-blur-sm"><div class="animate-spin rounded-full h-12 w-12 border-b-4 border-emerald-500 mb-4"></div><p class="font-bold text-slate-500">Processando...</p></div></div>
    </main>

    <div id="modal" class="fixed inset-0 bg-slate-900/80 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white w-full max-w-lg rounded-3xl p-0 shadow-2xl relative overflow-hidden">
            <div class="bg-gradient-to-r from-purple-900 to-indigo-900 p-4 text-white flex justify-between items-center"><h2 class="font-black uppercase flex items-center gap-2"><i class="fas fa-pen-to-square"></i> Novo</h2><button onclick="fecharModal()" class="text-white text-2xl">&times;</button></div>
            <form id="formFin" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <div><label class="text-xs font-bold text-slate-500 uppercase">Descrição</label><input id="f_desc" required class="w-full border-2 border-slate-200 p-3 rounded-xl font-semibold"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-xs font-bold text-slate-500 uppercase">Valor</label><input id="f_val" type="number" step="0.01" required class="w-full border-2 border-slate-200 p-3 rounded-xl font-black"></div>
                    <div><label class="text-xs font-bold text-slate-500 uppercase">Tipo</label><select id="f_type" class="w-full border-2 border-slate-200 p-3 rounded-xl bg-white font-semibold"><option value="ENTRADA">🟢 Entrada</option><option value="PENDENTE">🟠 Pendente</option><option value="SAIDA">🔴 Saída</option></select></div>
                </div>
                <div id="camposMercado" class="hidden bg-purple-50 p-3 rounded-xl border border-purple-100 space-y-3">
                    <label class="text-xs font-bold text-purple-600 uppercase">Campanha</label><select id="f_cat" class="w-full border p-2 rounded-lg"><option value="Mercadinho">Geral</option><option value="DiaDasMaes">Dia das Mães</option></select>
                    <select id="f_dia" class="w-full border p-2 rounded-lg font-bold"><option value="Sexta">Sexta</option><option value="Sabado">Sábado</option><option value="Domingo">Domingo</option></select>
                </div>
                <div id="camposFeijoada" class="hidden bg-orange-50 p-3 rounded-xl border border-orange-100 grid grid-cols-2 gap-3">
                    <div><label class="text-xs font-bold text-orange-600 uppercase">Qtd</label><input id="f_qtd" type="number" value="1" class="w-full border p-2 rounded-lg"></div>
                    <div><label class="text-xs font-bold text-orange-600 uppercase">Comunidade</label><input id="f_comun" class="w-full border p-2 rounded-lg"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-xs font-bold text-slate-500 uppercase">Nome</label><input id="f_nome" class="w-full border-2 border-slate-200 p-3 rounded-xl"></div>
                    <div><label class="text-xs font-bold text-slate-500 uppercase">Telefone</label><input id="f_tel" class="w-full border-2 border-slate-200 p-3 rounded-xl"></div>
                </div>
                <div><label class="text-xs font-bold text-slate-500 uppercase">Equipe</label><input id="f_equipe" class="w-full border-2 border-slate-200 p-3 rounded-xl"></div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-black p-4 rounded-xl hover:bg-emerald-700 shadow-lg mt-2">SALVAR</button>
            </form>
        </div>
    </div>

    <script>
        // ✅ URL FINAL (COLOQUE AQUI APÓS DEPLOY)
        const API = "URL_DO_DEPLOY_AQUI"; 

        const SENHA_ADMIN = "@admpilotos2026#";
        const SENHA_COMPRAS = "$compras2026";
        let ROLE = '', TOKEN = '';
        let abaAtiva = 'admin', dadosCache = [], filtroDiaAtual = 'Todos';

        function iniciarLogin(role) {
            const senha = prompt("🔒 Senha de Acesso:");
            if(role==='admin' && senha===SENHA_ADMIN) { ROLE='admin'; TOKEN="TOKEN_PILOTOS_2026"; }
            else if(role==='compras' && senha===SENHA_COMPRAS) { ROLE='compras'; TOKEN="TOKEN_COMPRAS_2026"; }
            else { return alert("⛔ Senha Incorreta!"); }
            
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("appHeader").classList.remove("hidden");
            document.getElementById("appMain").classList.remove("hidden");
            document.getElementById("userBadge").innerText = ROLE==='admin' ? "👑 PILOTOS" : "🛒 COMPRAS";
            aplicarPermissoes();
            carregar();
        }

        function aplicarPermissoes() {
            if(ROLE==='compras') {
                document.getElementById("tab-admin").style.display="none";
                document.getElementById("tab-feijoada").style.display="none";
                document.getElementById("tab-arquivo").style.display="none";
                document.querySelectorAll(".btn-export, .btn-arquivo").forEach(b=>b.style.display="none");
                mudarAba('compras');
            } else { mudarAba('admin'); }
        }

        function sair() { location.reload(); }

        // --- CORE COM TOKEN ---
        async function carregar() {
            document.getElementById("loading").classList.remove("hidden");
            let rota = "listarAdmin";
            if(abaAtiva==='compras') rota="listarCompras";
            if(abaAtiva==='feijoada') rota="listarFeijoada";
            if(abaAtiva==='arquivo') rota="listarArquivo";

            try {
                // ✅ GET AGORA ENVIA TOKEN
                const res = await fetch(`${API}?action=${rota}&token=${TOKEN}`);
                const json = await res.json();
                if(json.error) { alert(json.error); return; }
                dadosCache = json;
                document.getElementById("loading").classList.add("hidden");
                renderizarTabela();
            } catch(e) { console.error(e); }
        }

        // --- RENDERIZAÇÃO (IGUAL V5.5) ---
        function renderizarTabela() {
            const corpo=document.getElementById("corpoTabela");
            const areaCobranca=document.getElementById("areaCobranca");
            const listaDev=document.getElementById("listaDevedores");
            const top5Box=document.getElementById("top5Resumo");
            corpo.innerHTML=""; listaDev.innerHTML=""; top5Box.classList.add("hidden");

            let dados=dadosCache;
            if(abaAtiva==='compras' && filtroDiaAtual!=='Todos') dados=dados.filter(i=>i.ejc_dia===filtroDiaAtual);
            const eq=document.getElementById("filtroEquipe").value; if(eq) dados=dados.filter(i=>i.equipe===eq);
            const busca=document.getElementById("campoBusca").value.toLowerCase(); if(busca) dados=dados.filter(i=>(i.buyer_name && i.buyer_name.toLowerCase().includes(busca)));

            if(abaAtiva==='compras' && filtroDiaAtual==='Domingo') { areaCobranca.classList.remove("hidden"); renderizarCobranca(dados); } 
            else { areaCobranca.classList.add("hidden"); }

            let ent=0, sai=0;
            dados.reverse().forEach(i=>{
                const v=parseFloat(i.amount||0); const isPago=i.paid===true; const isSaida=i.type==="SAIDA";
                if(abaAtiva!=='arquivo' && isPago) { if(isSaida) sai+=v; else ent+=v; }
                let acoes = abaAtiva==='arquivo' ? '<span class="italic text-gray-400">Arquivado</span>' : 
                    `<div class="flex justify-center gap-2">
                        ${!isPago ? `<button onclick="baixar('${i.id}')" class="bg-emerald-100 text-emerald-600 w-8 h-8 rounded-full hover:bg-emerald-500 hover:text-white"><i class="fas fa-check"></i></button>`:''}
                        <button onclick="arquivar('${i.id}')" class="bg-gray-100 text-gray-400 w-8 h-8 rounded-full hover:bg-gray-500 hover:text-white"><i class="fas fa-box-archive"></i></button>
                    </div>`;
                corpo.innerHTML+=`<tr class="hover:bg-slate-50 border-b border-slate-50 ${isSaida?'bg-red-50/30':''}"><td class="p-4"><div class="text-xs font-bold text-slate-400">${new Date(i.date).toLocaleDateString()}</div>${i.ejc_dia?`<span class="bg-purple-100 text-purple-700 text-[10px] px-1 rounded">${i.ejc_dia}</span>`:''}</td><td class="p-4"><div class="font-bold text-slate-700">${i.description||i.product}</div><div class="text-[10px] uppercase font-bold text-purple-400">${i.category||'Geral'} • ${i.buyer_name||'-'} • ${i.equipe||'-'}</div></td><td class="p-4 text-right font-mono font-bold ${isSaida?'text-red-500':'text-emerald-600'}">${isSaida?'-':'+'} R$ ${v.toFixed(2)}</td><td class="p-4 text-center"><span class="px-2 py-1 rounded text-[10px] font-black uppercase ${isPago?'bg-emerald-100 text-emerald-700':'bg-orange-100 text-orange-700'}">${isPago?'Pago':'Pendente'}</span></td><td class="p-4 text-center">${acoes}</td></tr>`;
            });
            if(abaAtiva!=='arquivo') { document.getElementById("totEntradas").innerText=`R$ ${ent.toFixed(2)}`; document.getElementById("totSaidas").innerText=`R$ ${sai.toFixed(2)}`; document.getElementById("totSaldo").innerText=`R$ ${(ent-sai).toFixed(2)}`; }
        }

        function renderizarCobranca(dados) {
            const lista=document.getElementById("listaDevedores"); const devedores={};
            dados.forEach(i=>{
                if(!i.paid && i.buyer_name) {
                    const nome=i.buyer_name.toUpperCase();
                    if(!devedores[nome]) devedores[nome]={total:0,itens:[],ids:[],equipe:i.equipe||"-",tel:i.phone||""};
                    devedores[nome].total+=parseFloat(i.amount); devedores[nome].itens.push(i.product||i.description); devedores[nome].ids.push(i.id);
                }
            });
            if(Object.keys(devedores).length===0) { lista.innerHTML=`<div class="col-span-3 text-center text-slate-400 py-6">🎉 Zero Pendências!</div>`; return; }
            const ranking=Object.entries(devedores).sort((a,b)=>b[1].total-a[1].total);
            const box=document.getElementById("top5Resumo"); box.classList.remove("hidden");
            box.innerHTML=`<h3 class="font-black text-rose-700 uppercase mb-2">🔥 Top 5 Devedores</h3><ul class="text-xs text-slate-700 space-y-1">${ranking.slice(0,5).map(([n,d])=>`<li><b>${n}</b> — R$ ${d.total.toFixed(2)}</li>`).join("")}</ul>`;
            ranking.forEach(([nome,d])=>{
                const idsStr=JSON.stringify(d.ids).replace(/"/g,'&quot;');
                lista.innerHTML+=`<div class="bg-white border border-rose-200 p-4 rounded-xl shadow hover:shadow-lg transition"><h4 class="font-black text-slate-800">${nome}</h4><p class="text-xs text-slate-500 mb-2">Equipe: <b>${d.equipe}</b></p><div class="text-xs bg-slate-50 p-2 rounded mb-3 max-h-16 overflow-y-auto">${d.itens.join(", ")}</div><div class="flex justify-between items-center border-t pt-2"><span class="font-black text-rose-600 text-lg">R$ ${d.total.toFixed(2)}</span><button onclick="pagarLote(${idsStr})" class="bg-emerald-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:bg-emerald-700"><i class="fas fa-check-double"></i> PAGAR TUDO</button></div>${d.tel?`<a target="_blank" href="https://wa.me/55${d.tel.replace(/\D/g,'')}" class="block mt-3 text-xs text-emerald-600 font-bold hover:underline">📲 Cobrar no WhatsApp</a>`:""}</div>`;
            });
        }

        // --- ACTIONS COM TOKEN ---
        async function apiPost(action, payload) {
            document.getElementById("loading").classList.remove("hidden");
            // ✅ POST AGORA ENVIA TOKEN
            await fetch(API, { method:'POST', mode:'no-cors', body:JSON.stringify({ action, token:TOKEN, payload }) });
            setTimeout(carregar, 2000);
        }

        async function pagarLote(ids) { if(!confirm(`Pagar todos (${ids.length}) itens?`)) return; await apiPost("pagarLote", {ids}); }
        async function baixar(id) { if(confirm("Confirmar recebimento?")) await apiPost("marcarPago", {id}); }
        async function arquivar(id) { if(confirm("Mover para Arquivo?")) await apiPost("arquivar", {id}); }

        // --- SUBMIT ---
        document.getElementById("formFin").onsubmit = async (e) => {
            e.preventDefault(); const btn=e.target.querySelector('button[type="submit"]'); btn.innerHTML="SALVANDO..."; btn.disabled=true;
            const p={date:new Date().toISOString(), amount:parseFloat(document.getElementById("f_val").value), type:document.getElementById("f_type").value, category:document.getElementById("f_cat").value||"Geral", day:document.getElementById("f_dia").value, description:document.getElementById("f_desc").value, product:document.getElementById("f_desc").value, name:document.getElementById("f_nome").value, phone:document.getElementById("f_tel").value, equipe:document.getElementById("f_equipe").value, comunidade:document.getElementById("f_comun").value, qtd:document.getElementById("f_qtd").value, paid:document.getElementById("f_type").value==="ENTRADA"};
            let a="criarAdmin"; if(abaAtiva==='compras') a="criarVendaCompras"; if(abaAtiva==='feijoada') a="criarFeijoada";
            await apiPost(a, p);
            fecharModal(); e.target.reset(); btn.innerHTML="SALVAR"; btn.disabled=false;
        };

        // --- UI HELPERS ---
        function filtrarDia(d) { filtroDiaAtual=d; document.querySelectorAll('#painelDias button').forEach(b=>b.classList.remove('day-active','bg-emerald-500','text-white','bg-rose-500')); const btn=document.getElementById('day-'+d); if(d==='Domingo') btn.classList.add('bg-rose-500','text-white'); else btn.classList.add('day-active'); renderizarTabela(); }
        function filtrarBusca() { renderizarTabela(); }
        function mudarAba(a) { abaAtiva=a; document.querySelectorAll('button[id^="tab-"]').forEach(b=>{b.classList.remove('tab-active','text-emerald-600'); if(b.id==='tab-arquivo') b.classList.replace('bg-purple-600','bg-slate-800')}); if(a==='arquivo'){document.getElementById('tab-arquivo').classList.replace('bg-slate-800','bg-purple-600')}else{document.getElementById('tab-'+a).classList.add('tab-active','text-emerald-600')} document.getElementById("painelDias").classList.toggle("hidden", a!=='compras'); carregar(); }
        function abrirModal() { document.getElementById("modal").classList.remove("hidden"); document.getElementById("camposMercado").classList.toggle("hidden",abaAtiva!=='compras'); document.getElementById("camposFeijoada").classList.toggle("hidden",abaAtiva!=='feijoada'); }
        function fecharModal() { document.getElementById("modal").classList.add("hidden"); }
        function exportarExcel() { const ws=XLSX.utils.json_to_sheet(dadosCache); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Relatorio"); XLSX.writeFile(wb,`EJC_${abaAtiva}.xlsx`); }
        function exportarPDF() { const {jsPDF}=window.jspdf; const doc=new jsPDF(); doc.text(`Relatorio ${abaAtiva}`,14,15); doc.autoTable({startY:20, head:[['Data','Desc','Quem','Valor']], body:dadosCache.map(i=>[new Date(i.date).toLocaleDateString(),i.description||i.product,i.buyer_name,i.amount])}); doc.save(`Relatorio_${abaAtiva}.pdf`); }
    </script>
</body>
</html>

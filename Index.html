<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EJC BANK 21º • V14.3 FINAL</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <style>
    body { font-family: 'Montserrat', sans-serif; background-color: #f3f4f6; }
    .tab-active { border-bottom: 4px solid #10b981; color: #10b981; font-weight: 800; background-color: #f0fdf4; }
    .hidden { display: none !important; }
    .card-stat { transition: transform 0.2s; border-bottom: 4px solid rgba(0,0,0,0.1); }
    .card-stat:hover { transform: scale(1.02); }
  </style>
</head>

<body class="text-slate-800 min-h-screen flex flex-col">

<div id="loginScreen" class="fixed inset-0 flex items-center justify-center bg-slate-900 z-[999]">
  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-sm text-center border-b-8 border-purple-800">
    <div class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <i class="fas fa-landmark text-3xl text-purple-700"></i>
    </div>
    <h1 class="text-2xl font-black uppercase mb-1">EJC <span class="text-emerald-500">BANK</span></h1>
    <p class="text-[10px] text-slate-400 font-bold mb-6 uppercase tracking-widest text-center">Sistema Financeiro • 21º EJC</p>
    <input id="inputSenha" type="password" placeholder="Senha de Acesso" class="w-full border-2 p-3 rounded-xl font-bold text-center outline-none focus:border-purple-500">
    <div class="mt-6 space-y-3">
      <button onclick="tentarLogin('admin')" class="w-full bg-purple-700 text-white py-3 rounded-xl font-black shadow-lg">👑 PILOTOS</button>
      <button onclick="tentarLogin('compras')" class="w-full bg-emerald-500 text-white py-3 rounded-xl font-black shadow-lg">🛒 COMPRAS</button>
    </div>
    <p id="msgErroLogin" class="hidden mt-4 text-red-500 font-bold text-xs">⛔ Senha incorreta!</p>
  </div>
</div>

<header id="appHeader" class="hidden bg-gradient-to-r from-slate-900 via-purple-900 to-slate-900 text-white p-4 sticky top-0 z-50 shadow-xl border-b-2 border-emerald-500">
  <div class="flex justify-between items-center max-w-6xl mx-auto">
    <h1 class="font-black uppercase text-lg italic tracking-tighter">EJC <span class="text-emerald-400">BANK</span></h1>
    <div class="flex gap-2">
      <button onclick="exportarExcel()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs admin-only" title="Exportar Excel"><i class="fas fa-file-excel text-green-400"></i></button>
      <button onclick="abrirModal()" class="bg-emerald-500 hover:bg-emerald-400 px-4 py-2 rounded-lg font-black text-xs transition active:scale-95">➕ NOVO</button>
      <button onclick="sair()" class="bg-red-600/20 text-red-400 border border-red-400/30 px-3 py-2 rounded-lg font-black"><i class="fas fa-power-off"></i></button>
    </div>
  </div>
</header>

<main id="appMain" class="hidden max-w-6xl mx-auto p-4 w-full">
  <div id="dashAdmin" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 admin-only">
    <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-emerald-500 card-stat">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Recebido</p>
      <h2 id="totalRecebido" class="text-2xl font-black text-slate-700">R$ 0,00</h2>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-orange-500 card-stat">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pendente (Fiado)</p>
      <h2 id="totalPendente" class="text-2xl font-black text-orange-600">R$ 0,00</h2>
    </div>
    <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-purple-600 card-stat">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Saldo Líquido</p>
      <h2 id="totalLiquido" class="text-2xl font-black text-purple-800">R$ 0,00</h2>
    </div>
  </div>

  <div class="flex bg-white p-1 rounded-2xl shadow-md mb-6 overflow-hidden border border-slate-200">
    <button id="tab-admin" onclick="mudarAba('admin')" class="flex-1 py-3 text-xs font-black tab-active admin-only uppercase">Caixa</button>
    <button id="tab-feijoada" onclick="mudarAba('feijoada')" class="flex-1 py-3 text-xs font-black admin-only uppercase tracking-tighter">🍛 Feijoada</button>
    <button id="tab-compras" onclick="mudarAba('compras')" class="flex-1 py-3 text-xs font-black uppercase">🛒 Compras</button>
    <button id="tab-arquivo" onclick="mudarAba('arquivo')" class="flex-1 py-3 text-xs font-black admin-only uppercase tracking-tighter">📦 Arquivo</button>
  </div>

  <div id="painelFiltros" class="flex flex-col md:flex-row gap-3 mb-6 bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
    <select id="filtroDia" onchange="renderizarTabela()" class="p-2 rounded-lg text-xs font-bold border bg-slate-50 outline-none">
      <option value="Todos">Todos os Dias</option>
      <option value="Sexta">Sexta</option>
      <option value="Sabado">Sábado</option>
      <option value="Domingo">Domingo</option>
    </select>
    <input type="text" id="campoBusca" onkeyup="renderizarTabela()" placeholder="🔍 Buscar nome ou descrição..." class="flex-1 p-2 rounded-lg text-xs font-bold border bg-slate-50 outline-none">
  </div>

  <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    <table class="w-full text-left">
      <thead class="bg-slate-50 text-slate-500 uppercase text-[10px] font-black border-b">
        <tr><th class="p-4">Info</th><th class="p-4">Descrição</th><th class="p-4 text-right">Valor</th><th class="p-4 text-center">Status</th><th class="p-4 text-center">Ação</th></tr>
      </thead>
      <tbody id="corpoTabela" class="divide-y divide-slate-100 text-xs font-medium text-slate-700"></tbody>
    </table>
  </div>
  <div id="loading" class="hidden py-10 flex flex-col items-center"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-emerald-500 mb-2"></div><span class="text-slate-400 font-bold uppercase text-[10px]">Sincronizando...</span></div>
</main>

<div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4">
  <div class="bg-white p-6 rounded-3xl w-full max-w-lg shadow-2xl">
    <h2 id="modalTitle" class="font-black mb-4 uppercase text-purple-700">Novo Lançamento</h2>
    <form id="formFin" class="space-y-3">
      <input id="f_desc" placeholder="Descrição" class="w-full border p-3 rounded-xl font-bold focus:border-purple-500 outline-none" required>
      <input id="f_val" type="number" step="0.01" placeholder="Valor R$" class="w-full border p-3 rounded-xl font-bold" required>
      <select id="f_type" class="w-full border p-3 rounded-xl font-bold bg-white outline-none">
        <option value="ENTRADA">🟢 Entrada</option><option value="PENDENTE">🟠 Pendente</option><option value="SAIDA">🔴 Saída</option>
      </select>
      <div id="camposMercado" class="hidden bg-purple-50 p-3 rounded-xl space-y-2 border border-purple-100">
        <select id="f_dia" class="w-full border p-2 rounded-lg font-bold"><option value="Sexta">Sexta</option><option value="Sabado">Sábado</option><option value="Domingo">Domingo</option></select>
        <select id="f_equipe" class="w-full border p-2 rounded-lg font-bold">
            <option value="">Equipe da Pessoa...</option>
            <option>Animação</option><option>Apoio ao Patrimônio</option><option>Café</option><option>Casal Coordenador Geral</option><option>Círculo</option><option>Compras</option><option>Cozinha</option><option>Intercessão</option><option>Liturgia</option><option>Ordem</option><option>Piloto</option><option>Sala</option><option>Secretaria</option><option>Som e Iluminação</option><option>Trânsito</option><option>Visitação</option>
        </select>
      </div>
      <div id="camposFeijoada" class="hidden bg-orange-50 p-3 rounded-xl space-y-2 border border-orange-100">
        <input id="f_qtd" type="number" value="1" class="w-full border p-2 rounded-lg font-bold">
        <input id="f_comun" placeholder="Comunidade" class="w-full border p-2 rounded-lg font-bold uppercase">
      </div>
      <input id="f_nome" placeholder="Nome da Pessoa" class="w-full border p-3 rounded-xl font-bold">
      <input id="f_recebido" placeholder="Recebido por (Seu Nome)" class="w-full border p-3 rounded-xl font-bold">
      <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-4 rounded-2xl font-black shadow-lg transition active:scale-95">💾 SALVAR REGISTRO</button>
      <button type="button" onclick="fecharModal()" class="w-full py-2 text-slate-400 font-bold">Cancelar</button>
    </form>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbziecBve__1I_ccKJ2RjkZST0LXyQv0QqA5Jc8KOLoPe20Cbz2tEE0j0-2g0ewmZ4Avmg/exec";
const SENHA_ADMIN = "@admpilotos2026#"; const SENHA_COMPRAS = "$compras2026";
let ROLE="", TOKEN="", abaAtiva="admin", dadosCache=[];

function tentarLogin(role){
  const senha=document.getElementById("inputSenha").value;
  if(role==="admin" && senha===SENHA_ADMIN){ ROLE="admin"; TOKEN="TOKEN_PILOTOS_2026"; }
  else if(role==="compras" && senha===SENHA_COMPRAS){ ROLE="compras"; TOKEN="TOKEN_COMPRAS_2026"; }
  else { document.getElementById("msgErroLogin").classList.remove("hidden"); return; }
  document.getElementById("loginScreen").classList.add("hidden"); document.getElementById("appHeader").classList.remove("hidden");
  document.getElementById("appMain").classList.remove("hidden"); carregar();
}

function sair(){ location.reload(); }

async function carregar(){
  document.getElementById("loading").classList.remove("hidden");
  let rota = abaAtiva==="compras"?"listarCompras":abaAtiva==="feijoada"?"listarFeijoada":abaAtiva==="arquivo"?"listarArquivo":"listarAdminFull";
  const res = await fetch(`${API}?action=${rota}&token=${TOKEN}`);
  dadosCache = await res.json(); renderizarTabela(); if(ROLE==="admin") atualizarStats();
  document.getElementById("loading").classList.add("hidden");
}

function renderizarTabela(){
  const corpo=document.getElementById("corpoTabela"); const busca=document.getElementById("campoBusca").value.toLowerCase();
  const filtroDia=document.getElementById("filtroDia").value; corpo.innerHTML="";

  // ✅ FIX: Evita mutação do array original usando [...spread]
  [...dadosCache].reverse().forEach(i=>{
    const pago = i.paid===true || i.paid==="TRUE";
    const desc = i.description || i.product || "Registro";
    if(busca && !desc.toLowerCase().includes(busca) && !(i.buyer_name||"").toLowerCase().includes(busca)) return;
    if(filtroDia!=="Todos" && i.ejc_dia && i.ejc_dia !== filtroDia) return;

    corpo.innerHTML+=`
      <tr class="border-b hover:bg-slate-50 transition">
        <td class="p-4 text-slate-400 font-bold whitespace-nowrap">${new Date(i.date).toLocaleDateString()}<br><span class="text-[9px] uppercase opacity-60">${i.ejc_dia||''}</span></td>
        <td class="p-4"><div class="font-bold text-slate-700">${desc}</div><div class="text-[10px] text-slate-400">${i.buyer_name||i.name||''} ${i.comunidade?' • ⛪ '+i.comunidade:''} ${i.equipe?' • '+i.equipe:''}</div></td>
        <td class="p-4 text-right font-black ${i.type==="SAIDA"?'text-red-500':'text-slate-600'}">R$ ${parseFloat(i.amount||0).toFixed(2)}</td>
        <td class="p-4 text-center font-bold text-[9px]">${abaAtiva==="arquivo"?"📦 ARQUIVO":pago?"✅ PAGO":"🟠 PENDENTE"}</td>
        <td class="p-4 text-center">${!pago && abaAtiva!=="feijoada" && abaAtiva!=="arquivo" ? `<button onclick="baixar('${i.id}')" class="bg-emerald-500 text-white w-8 h-8 rounded-full shadow transition transform active:scale-90 flex items-center justify-center mx-auto">✔</button>` : "-"}</td>
      </tr>`;
  });
}

function atualizarStats(){
  let rec=0, pend=0, sai=0;
  dadosCache.forEach(i=>{
    const v = parseFloat(i.amount||0);
    const pago = i.paid===true || i.paid==="TRUE";
    if(i.type==="SAIDA") sai += v;
    else if(pago) rec += v;
    else pend += v;
  });
  document.getElementById("totalRecebido").innerText = `R$ ${rec.toFixed(2)}`;
  document.getElementById("totalPendente").innerText = `R$ ${pend.toFixed(2)}`;
  document.getElementById("totalLiquido").innerText = `R$ ${(rec - sai).toFixed(2)}`;
}

async function apiPost(action,payload){
  document.getElementById("loading").classList.remove("hidden");
  await fetch(API,{ method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify({ action, token:TOKEN, payload }) });
  setTimeout(carregar, 800);
}

async function baixar(id){
  if(!confirm("Confirmar recebimento?")) return;
  dadosCache = dadosCache.map(i => i.id === id ? { ...i, paid: true } : i);
  renderizarTabela(); await apiPost("marcarPago",{id});
}

function mudarAba(a){
  abaAtiva=a; document.querySelectorAll("button[id^='tab-']").forEach(b=>b.classList.remove("tab-active"));
  document.getElementById("tab-"+a).classList.add("tab-active"); carregar();
}

function abrirModal(){
  document.getElementById("modal").classList.remove("hidden");
  document.getElementById("camposMercado").classList.toggle("hidden",abaAtiva!=="compras");
  document.getElementById("camposFeijoada").classList.toggle("hidden",abaAtiva!=="feijoada");
}
function fecharModal(){ document.getElementById("modal").classList.add("hidden"); }

document.getElementById("formFin").addEventListener("submit",async function(e){
  e.preventDefault();
  const desc=document.getElementById("f_desc").value; const val=parseFloat(document.getElementById("f_val").value);
  const tipo=document.getElementById("f_type").value; const nome=document.getElementById("f_nome").value;
  const recebido=document.getElementById("f_recebido").value;

  if(abaAtiva==="compras"){
    if(!document.getElementById("f_equipe").value) return alert("⛔ Selecione a equipe!");
    if(tipo==="SAIDA") return alert("⛔ Compras não lança saída.");
    if(document.getElementById("f_dia").value==="Domingo" && tipo!=="ENTRADA") return alert("⛔ Domingo não permite pendências!");
  }
  if(abaAtiva==="feijoada" && !recebido) return alert("⛔ Feijoada exige: Recebido por");

  if(abaAtiva==="admin") await apiPost("criarAdmin",{ date:new Date(), type:tipo, description:desc, amount:val, name:nome, paid:tipo==="ENTRADA", recebidoPor:recebido });
  if(abaAtiva==="compras") await apiPost("criarVendaCompras",{ date:new Date(), category:"EJC", product:desc, amount:val, name:nome, paid:tipo==="ENTRADA", recebidoPor:recebido, day:document.getElementById("f_dia").value, equipe:document.getElementById("f_equipe").value });
  if(abaAtiva==="feijoada") await apiPost("criarFeijoada",{ date:new Date(), product:desc, qtd:parseInt(document.getElementById("f_qtd").value||1), amount:val, name:nome, comunidade:document.getElementById("f_comun").value, paid:true, recebidoPor:recebido });
  fecharModal(); this.reset();
});

function exportarExcel() {
  const dadosLimpos = dadosCache.map(i => ({
    Data: new Date(i.date).toLocaleDateString(),
    Descrição: i.description || i.product,
    Valor: i.amount,
    Status: (i.paid || i.paid==="TRUE") ? "Pago" : "Pendente",
    Equipe: i.equipe || "",
    Dia: i.ejc_dia || "",
    RecebidoPor: i.recebidoPor || i.recebido_por || ""
  }));
  const wb = XLSX.utils.book_new(); const ws = XLSX.utils.json_to_sheet(dadosLimpos);
  XLSX.utils.book_append_sheet(wb, ws, abaAtiva.toUpperCase());
  XLSX.writeFile(wb, `EJC_BANK_${abaAtiva.toUpperCase()}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

document.getElementById("modal").addEventListener("click", function(e){ if(e.target === this) fecharModal(); });
</script>
</body>
</html>

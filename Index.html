<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>💜 EJC Santo Eugênio • Sistema Financeiro</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Excel Real -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    *{font-family:Poppins,sans-serif;}
    body{background:#f8fafc;}
    .card{
      background:white;
      border-radius:18px;
      border:1px solid #e5e7eb;
      padding:18px;
      box-shadow:0 8px 30px rgba(0,0,0,.05);
    }
    .btn{
      padding:12px 16px;
      border-radius:14px;
      font-weight:800;
      transition:.2s;
    }
    .btn:hover{transform:translateY(-2px);}
    .tabBtn{
      padding:10px 14px;
      border-radius:14px;
      font-weight:700;
      background:#f1f5f9;
      white-space:nowrap;
    }
    .tabBtn.active{
      background:#7c3aed;
      color:white;
    }
  </style>
</head>

<body class="min-h-screen">

<!-- LOGIN -->
<div id="loginScreen" class="fixed inset-0 flex items-center justify-center bg-gradient-to-br from-purple-700 to-indigo-900 z-50">
  <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl mx-4">
    <h1 class="text-3xl font-extrabold text-center mb-2 text-gray-800">💜 EJC 2026</h1>
    <p class="text-center text-gray-500 mb-6">Sistema Financeiro Oficial</p>

    <input id="passwordInput" type="password"
      placeholder="Digite sua senha"
      class="w-full border rounded-xl px-4 py-3 mb-4 outline-none"/>

    <button onclick="loginAdmin()" class="btn w-full bg-purple-700 text-white mb-3">
      👑 Entrar Pilotos Finanças
    </button>

    <button onclick="loginCompras()" class="btn w-full bg-green-600 text-white">
      🛒 Entrar Equipe Compras
    </button>

    <p id="loginError" class="hidden mt-4 text-center text-red-500 font-bold">
      ❌ Senha incorreta
    </p>
  </div>
</div>

<!-- HEADER -->
<header id="appHeader" class="hidden bg-white border-b px-6 py-4 sticky top-0 shadow z-40">
  <div class="flex justify-between items-center">
    <h2 class="font-extrabold text-xl text-gray-800">📊 Painel Financeiro EJC</h2>
    <button onclick="logout()" class="btn bg-gray-100 text-sm">
      🚪 Sair
    </button>
  </div>

  <!-- NAV TABS -->
  <div id="tabsNav" class="hidden flex gap-2 mt-4 overflow-x-auto pb-2"></div>
</header>

<!-- CONTEÚDO -->
<main class="p-6 max-w-6xl mx-auto space-y-6">

  <!-- ADMIN SECTIONS -->
  <section id="tab-dashboard" class="tabSection hidden"></section>
  <section id="tab-ejc" class="tabSection hidden"></section>
  <section id="tab-feijoada" class="tabSection hidden"></section>
  <section id="tab-mercadinho" class="tabSection hidden"></section>
  <section id="tab-outros" class="tabSection hidden"></section>
  <section id="tab-historico" class="tabSection hidden"></section>
  <section id="tab-exportar" class="tabSection hidden"></section>

  <!-- COMPRAS SECTION -->
  <section id="tab-compras" class="tabSection hidden"></section>

</main>

<script>
/* ===================== CONFIG ===================== */
const API_URL="https://script.google.com/macros/s/AKfycbzxKh6wEaKatDBMvZ45ac9tnC5FxBzyTrnq42-wH92QmWPqUK8c_qH4vEVLDrBGQyinkg/exec";

const PASS_ADMIN="@admpilotosejc2026#";
const PASS_COMPRAS="$compras2026";

let role=null;
let adminData=[];
let comprasData=[];
let chart=null;

/* ===================== LOGIN ===================== */
function loginAdmin(){
  if(passwordInput.value===PASS_ADMIN){role="admin";startApp();}
  else showError();
}
function loginCompras(){
  if(passwordInput.value===PASS_COMPRAS){role="compras";startApp();}
  else showError();
}
function showError(){
  loginError.classList.remove("hidden");
  setTimeout(()=>loginError.classList.add("hidden"),2000);
}
function logout(){location.reload();}

/* ===================== START ===================== */
async function startApp(){
  loginScreen.classList.add("hidden");
  appHeader.classList.remove("hidden");
  tabsNav.classList.remove("hidden");

  montarTabs();
  await carregarTudo();
}

/* ===================== TABS ===================== */
function montarTabs(){
  tabsNav.innerHTML="";

  if(role==="admin"){
    criarTab("Dashboard","dashboard");
    criarTab("⛪ EJC","ejc");
    criarTab("🍲 Feijoada","feijoada");
    criarTab("🛒 Mercadinho","mercadinho");
    criarTab("📁 Outros","outros");
    criarTab("📑 Histórico","historico");
    criarTab("📤 Exportar","exportar");
  }

  if(role==="compras"){
    criarTab("🛒 Compras","compras");
  }

  abrirTab(role==="admin"?"dashboard":"compras");
}

function criarTab(nome,id){
  const btn=document.createElement("button");
  btn.innerText=nome;
  btn.className="tabBtn";
  btn.onclick=()=>abrirTab(id);
  btn.id="btn-"+id;
  tabsNav.appendChild(btn);
}

function abrirTab(id){
  document.querySelectorAll(".tabSection").forEach(s=>s.classList.add("hidden"));
  document.querySelectorAll(".tabBtn").forEach(b=>b.classList.remove("active"));

  document.getElementById("tab-"+id).classList.remove("hidden");
  document.getElementById("btn-"+id).classList.add("active");

  renderTudo();
}

/* ===================== LOAD ===================== */
async function carregarTudo(){
  adminData = await (await fetch(API_URL+"?action=listarAdmin")).json();
  comprasData = await (await fetch(API_URL+"?action=listarCompras")).json();
  renderTudo();
}

/* ===================== POST ===================== */
async function postar(action,payload){
  await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action,payload})
  });
  await carregarTudo();
}

/* ===================== RENDER MASTER ===================== */
function renderTudo(){
  if(role==="admin"){
    renderDashboard();
    renderEJC();
    renderCategoria("Feijoada","tab-feijoada","🍲 Aba Feijoada Completa");
    renderMercadinho();
    renderCategoria("Outros","tab-outros","📁 Outros Movimentos");
    renderHistorico();
    renderExportar();
  }

  if(role==="compras"){
    renderCompras();
  }
}

/* ===================== DASHBOARD ===================== */
function renderDashboard(){
  const tudo=[...adminData,...comprasData];

  let entradas=0,saidas=0,pend=0;

  tudo.forEach(t=>{
    const v=parseFloat(t.amount||0);
    if(t.type==="Entrada") entradas+=v;
    if(t.type==="Saida") saidas+=v;
    if(t.paid===false) pend+=v;
  });

  document.getElementById("tab-dashboard").innerHTML=`
    <h1 class="text-2xl font-extrabold mb-4">👑 Pilotos Finanças — Dashboard Geral</h1>

    <div class="grid md:grid-cols-4 gap-4">
      <div class="card border-l-4 border-green-500">
        <p class="text-xs font-bold">💚 Entradas</p>
        <h2 class="text-2xl font-extrabold text-green-600">R$ ${entradas.toFixed(2)}</h2>
      </div>
      <div class="card border-l-4 border-red-500">
        <p class="text-xs font-bold">❤️ Saídas</p>
        <h2 class="text-2xl font-extrabold text-red-500">R$ ${saidas.toFixed(2)}</h2>
      </div>
      <div class="card border-l-4 border-purple-600">
        <p class="text-xs font-bold">💜 Saldo Total</p>
        <h2 class="text-2xl font-extrabold text-purple-700">R$ ${(entradas-saidas).toFixed(2)}</h2>
      </div>
      <div class="card border-l-4 border-yellow-500">
        <p class="text-xs font-bold">⚠️ Pendências</p>
        <h2 class="text-2xl font-extrabold text-yellow-600">R$ ${pend.toFixed(2)}</h2>
      </div>
    </div>

    <div class="card mt-6">
      <h2 class="font-bold mb-3">🍀 Distribuição por Categoria</h2>
      <canvas id="chartCategorias"></canvas>
    </div>
  `;

  const categorias={};
  tudo.forEach(t=>{
    categorias[t.category]=(categorias[t.category]||0)+parseFloat(t.amount||0);
  });

  setTimeout(()=>{
    if(chart) chart.destroy();
    chart=new Chart(chartCategorias,{
      type:"pie",
      data:{
        labels:Object.keys(categorias),
        datasets:[{data:Object.values(categorias)}]
      }
    });
  },200);
}

/* ===================== EJC ===================== */
function renderEJC(){
  const dias=["Sexta","Sabado","Domingo"];
  let html=`<h1 class="text-2xl font-extrabold mb-4">⛪ Aba EJC — Fechamento por Dia</h1>`;

  dias.forEach(d=>{
    let total=0,pend=0;

    comprasData.filter(x=>x.category==="EJC" && x.ejc_dia===d)
      .forEach(v=>{
        total+=parseFloat(v.amount||0);
        if(v.paid===false) pend+=parseFloat(v.amount||0);
      });

    html+=`
      <div class="card mb-3">
        <h2 class="font-bold">✨ ${d}</h2>
        <p>Total: <b>R$ ${total.toFixed(2)}</b></p>
        <p>Pendências: <b class="text-red-600">R$ ${pend.toFixed(2)}</b></p>
      </div>
    `;
  });

  document.getElementById("tab-ejc").innerHTML=html;
}

/* ===================== MERCADINHO ===================== */
function renderMercadinho(){
  let html=`<h1 class="text-2xl font-extrabold mb-4">🛒 Mercadinho — Campanhas</h1>`;

  [["DiaDasMaes","🌸 Dia das Mães"],["DiaDosNamorados","💘 Dia dos Namorados"]]
    .forEach(([cat,nome])=>{
      let total=0;
      comprasData.filter(x=>x.category===cat)
        .forEach(v=>total+=parseFloat(v.amount||0));

      html+=`
        <div class="card mb-3">
          <h2 class="font-bold">${nome}</h2>
          <p>Total vendido: <b class="text-green-700">R$ ${total.toFixed(2)}</b></p>
        </div>
      `;
    });

  document.getElementById("tab-mercadinho").innerHTML=html;
}

/* ===================== CATEGORIA GENÉRICA ===================== */
function renderCategoria(cat,tabId,titulo){
  let lista=[...adminData,...comprasData].filter(x=>x.category===cat);

  let html=`<h1 class="text-2xl font-extrabold mb-4">${titulo}</h1>`;

  if(lista.length===0){
    html+=`<p class="text-gray-500">Nenhum registro ainda.</p>`;
  } else {
    lista.reverse().forEach(t=>{
      html+=`
        <div class="card mb-2 flex justify-between">
          <div>
            <b>${t.description}</b>
            <p class="text-xs text-gray-500">${t.paid?"Pago":"Pendente"}</p>
          </div>
          <span class="font-bold">R$ ${parseFloat(t.amount||0).toFixed(2)}</span>
        </div>
      `;
    });
  }

  document.getElementById(tabId).innerHTML=html;
}

/* ===================== HISTÓRICO ===================== */
function renderHistorico(){
  const tudo=[...adminData,...comprasData];
  let html=`<h1 class="text-2xl font-extrabold mb-4">📑 Histórico Completo</h1>`;

  tudo.reverse().slice(0,100).forEach(t=>{
    html+=`
      <div class="card mb-2 flex justify-between">
        <div>
          <b>${t.description}</b>
          <p class="text-xs text-gray-500">${t.category}</p>
        </div>
        <span class="font-bold">R$ ${parseFloat(t.amount||0).toFixed(2)}</span>
      </div>
    `;
  });

  document.getElementById("tab-historico").innerHTML=html;
}

/* ===================== EXPORTAR ===================== */
function renderExportar(){
  document.getElementById("tab-exportar").innerHTML=`
    <h1 class="text-2xl font-extrabold mb-4">📤 Exportações Oficiais</h1>

    <div class="card mb-3">
      <button onclick="exportarPDF()" class="btn w-full bg-purple-700 text-white mb-3">
        📄 Exportar PDF
      </button>

      <button onclick="exportarExcel()" class="btn w-full bg-green-600 text-white">
        📊 Exportar Excel Verdadeiro (.xlsx)
      </button>
    </div>
  `;
}

function exportarPDF(){
  const { jsPDF }=window.jspdf;
  const doc=new jsPDF();
  doc.text("Prestação Oficial EJC 2026",20,20);

  let y=40;
  comprasData.forEach(v=>{
    doc.text(`${v.description} - R$ ${v.amount}`,20,y);
    y+=8;
  });

  doc.save("Prestacao_EJC2026.pdf");
}

function exportarExcel(){
  const ws=XLSX.utils.json_to_sheet(comprasData);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Prestacao");
  XLSX.writeFile(wb,"Prestacao_EJC2026.xlsx");
}

/* ===================== COMPRAS ===================== */
function renderCompras(){
  let html=`<h1 class="text-2xl font-extrabold mb-4">🛒 Equipe Compras — Pendências</h1>`;

  const pend=comprasData.filter(x=>x.paid===false);

  if(pend.length===0){
    html+=`<p class="text-green-600 font-bold">🎉 Nenhuma pendência!</p>`;
  } else {
    pend.forEach(d=>{
      html+=`
        <div class="card mb-2 flex justify-between">
          <div>
            <b>${d.equipe_devedora}</b>
            <p class="text-xs">${d.description}</p>
          </div>
          <button onclick="darBaixa('${d.id}')" class="btn bg-red-600 text-white text-xs">
            Receber
          </button>
        </div>
      `;
    });
  }

  document.getElementById("tab-compras").innerHTML=html;
}

async function darBaixa(id){
  const forma=prompt("Forma pagamento?");
  const recebido=prompt("Quem recebeu?");
  await postar("marcarPago",{id,forma_pagamento:forma,received_by:recebido});
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>EJC BANK • Secure Access</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <style>
    :root { --brand-primary: #820ad1; --vault-dark: #0f172a; --vault-silver: #f8fafc; }
    body { font-family: "Plus Jakarta Sans", sans-serif; background-color: var(--vault-silver); overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    
    /* Fundo chique com gradiente radial e textura discreta */
    .bg-elite {
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
      position: relative;
    }
    .bg-elite::before {
      content: ""; position: absolute; inset: 0;
      background-image: url("https://www.transparenttextures.com/patterns/cubes.png");
      opacity: 0.05;
    }

    .premium-card {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
    }

    .tab-ios { background: #f1f5f9; border-radius: 14px; padding: 4px; }
    .tab-ios button { border-radius: 10px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

    .vault-input {
      background: #f8fafc; border: 1px solid #e2e8f0; transition: all 0.3s ease;
    }
    .vault-input:focus { background: white; border-color: var(--brand-primary); box-shadow: 0 0 0 1px var(--brand-primary); }

    .nu-header {
      background: var(--vault-dark);
      color: white; padding-bottom: 24px; border-bottom-left-radius: 32px; border-bottom-right-radius: 32px;
    }

    .fab {
      position: fixed; bottom: 32px; right: 32px; width: 64px; height: 64px; background: var(--vault-dark); color: white;
      border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); display: flex; align-items: center; justify-content: center; font-size: 24px; z-index: 50; transition: transform 0.2s;
    }

    .hidden { display: none !important; }
    #toast-container { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 400px; }
    .toast { background: white; color: var(--vault-dark); border-left: 4px solid var(--brand-primary); padding: 16px 20px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 12px; }
    
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-elite { animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col">

  <div id="toast-container"></div>

  <div id="loginScreen" class="fixed inset-0 z-[999] flex items-center justify-center px-6 bg-elite">
    <div class="w-full max-w-sm premium-card p-10 animate-elite">
      
      <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-900 rounded-2xl mb-6 text-white text-3xl shadow-2xl">
          <i class="fas fa-shield-halved"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">EJC<span class="font-light text-slate-500">BANK</span></h1>
        <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-3">Secure Financial Access</p>
      </div>

      <div class="flex tab-ios mb-10">
        <button type="button" id="tabBtnCompras" onclick="mudarAbaLogin('compras')" class="flex-1 py-2.5 text-[11px] font-bold uppercase tracking-widest bg-white shadow-sm text-slate-900">Operation</button>
        <button type="button" id="tabBtnPilotos" onclick="mudarAbaLogin('pilotos')" class="flex-1 py-2.5 text-[11px] font-bold uppercase tracking-widest text-slate-400">Executive</button>
      </div>

      <form id="formCompras" onsubmit="event.preventDefault(); loginCompras();" class="space-y-6">
        <div class="space-y-2">
          <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Access Pin</p>
          <input type="password" id="senhaCompras" placeholder="••••" required class="vault-input w-full rounded-xl py-4 px-5 font-bold outline-none text-center text-2xl tracking-[0.5em] text-slate-800" />
        </div>
        <button type="submit" id="btnCompras" class="w-full py-4 rounded-xl font-bold text-white bg-slate-900 hover:bg-black transition-all">AUTHORIZED LOGIN</button>
      </form>

      <form id="formPilotos" onsubmit="event.preventDefault(); loginPiloto();" class="space-y-5 hidden">
        <div class="space-y-4">
          <input type="email" id="emailPiloto" placeholder="Executive Email" required class="vault-input w-full rounded-xl py-4 px-5 font-bold outline-none text-slate-700" />
          <input type="password" id="senhaPiloto" placeholder="Secure Password" required class="vault-input w-full rounded-xl py-4 px-5 font-bold outline-none text-slate-700" />
        </div>
        <button type="submit" id="btnPiloto" class="w-full py-4 rounded-xl font-bold text-white bg-slate-900 hover:bg-black transition-all">EXECUTIVE ACCESS</button>
      </form>

      <p id="msgErroLogin" class="hidden mt-8 text-rose-600 text-[10px] font-bold text-center uppercase tracking-widest bg-rose-50 py-3 rounded-lg border border-rose-100">Authentication Failed</p>
    </div>
  </div>

  <div id="appMain" class="hidden flex-1 flex flex-col max-w-6xl mx-auto w-full">
    <header class="nu-header sticky top-0 z-40 px-6 pt-8">
      <div class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
          <div id="userAvatar" class="w-12 h-12 bg-white/10 border border-white/20 rounded-xl flex items-center justify-center text-white font-bold text-xl">U</div>
          <div>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">System Authorized</p>
            <h1 id="headerTitle" class="font-extrabold text-xl tracking-tight leading-none">EJC BANK</h1>
          </div>
        </div>
        <button onclick="sair()" class="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-slate-400 hover:text-white transition"><i class="fas fa-arrow-right-from-bracket"></i></button>
      </div>

      <div class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
        <button id="tab-admin" onclick="mudarAba('ADMIN')" class="tab-btn px-6 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest bg-white/5 text-slate-400 hidden">Overview</button>
        <button id="tab-ejc" onclick="mudarAba('EJC')" class="tab-btn px-6 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest bg-white/5 text-slate-400">Core Fund</button>
        <button id="tab-mercadinho" onclick="mudarAba('MERCADINHO')" class="tab-btn px-6 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest bg-white/5 text-slate-400">Retail</button>
        <button id="tab-feijoada" onclick="mudarAba('FEIJOADA')" class="tab-btn px-6 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest bg-white/5 text-slate-400 hidden">Catering</button>
        <button id="tab-doacao" onclick="mudarAba('DOACAO')" class="tab-btn px-6 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-widest bg-white/5 text-slate-400 hidden">Philanthropy</button>
      </div>
    </header>

    <main class="px-6 py-8 space-y-8">
      <div id="blocoAdminDoacao" class="hidden animate-elite">
        <button onclick="document.getElementById('modalMeta').classList.remove('hidden')" class="w-full bg-white text-slate-900 border border-slate-200 py-5 rounded-2xl font-extrabold shadow-sm flex items-center justify-center gap-3 active:scale-95 transition mb-4"><i class="fas fa-plus"></i> NEW PHILANTHROPIC TARGET</button>
        <div id="listaGerenciarMetas" class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm space-y-2"></div>
      </div>

      <div id="dashAdmin" class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 hidden">
        <div id="dashGrid" class="grid grid-cols-1 sm:grid-cols-4 gap-8">
          <div><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3">Gross Inflow</p><h2 id="totalRecebido" class="text-3xl font-extrabold text-slate-900">R$ 0,00</h2></div>
          <div><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3">Pending</p><h2 id="totalPendente" class="text-3xl font-extrabold text-amber-500">R$ 0,00</h2></div>
          <div><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3">Expenses</p><h2 id="totalSaidas" class="text-3xl font-extrabold text-rose-500">R$ 0,00</h2></div>
          <div id="cardSaldoLiquido"><p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3">Net Capital</p><h2 id="totalLiquido" class="text-3xl font-extrabold text-brand-primary">R$ 0,00</h2></div>
        </div>
      </div>

      <div id="blocoPDF" class="hidden"><button onclick="gerarPDFRelatorio()" class="w-full bg-slate-100 text-slate-600 py-4 rounded-xl font-bold flex items-center justify-center gap-3 active:scale-95 transition border border-slate-200"><i class="fas fa-file-invoice"></i> EXPORT DAILY LEDGER (PDF)</button></div>

      <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm mb-20">
        <div class="p-6 border-b border-slate-50 flex gap-4 items-center"><i class="fas fa-magnifying-glass text-slate-300"></i><input id="campoBusca" onkeyup="renderizar()" placeholder="Search Ledger..." class="w-full text-sm font-semibold outline-none text-slate-700" /></div>
        <div id="loading" class="hidden p-12 text-center text-slate-300"><i class="fas fa-spinner fa-spin text-2xl"></i></div>
        <div class="overflow-x-auto"><table class="w-full text-left text-sm border-collapse"><tbody id="corpoTabela" class="divide-y divide-slate-50"></tbody></table></div>
      </div>
    </main>

    <button onclick="abrirModal()" class="fab"><i class="fas fa-plus"></i></button>
  </div>

  <script>
    const SUPABASE_URL = 'https://sfxlfkfjqaemjotsedep.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmeGxma2ZqcWFlbWpvdHNlZGVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MDU1MDQsImV4cCI6MjA4OTk4MTUwNH0.2JWeglgFALa88C9nWMrTmsIlogxcNg3rD2SrE1DJWyM';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null, currentProfile = null, ROLE = "", abaAtiva = "ADMIN", dadosCache = [];
    const esc = (str) => str ? str.toString().replace(/[&<>'"]/g, (t) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t])) : "";

    function showToast(msg, type = "success") {
      const t = document.createElement("div"); t.className = "toast";
      t.innerHTML = `<i class="fas ${type === "error" ? "fa-circle-xmark text-rose-500" : "fa-circle-check text-emerald-500"}"></i> ${esc(msg)}`;
      document.getElementById("toast-container").appendChild(t); setTimeout(() => t.remove(), 3500);
    }

    function mudarAbaLogin(aba) {
      document.getElementById("msgErroLogin").classList.add("hidden");
      const isCompras = aba === "compras";
      document.getElementById("formCompras").classList.toggle("hidden", !isCompras);
      document.getElementById("formPilotos").classList.toggle("hidden", isCompras);
      document.getElementById("tabBtnCompras").className = isCompras ? "flex-1 py-2.5 text-[11px] font-bold uppercase tracking-widest bg-white shadow-sm text-slate-900 transition" : "flex-1 py-2.5 text-[11px] font-bold uppercase tracking-widest text-slate-400 transition";
      document.getElementById("tabBtnPilotos").className = !isCompras ? "flex-1 py-2.5 text-[11px] font-bold uppercase tracking-widest bg-white shadow-sm text-slate-900 transition" : "flex-1 py-2.5 text-[11px] font-bold uppercase tracking-widest text-slate-400 transition";
    }

    async function carregarPerfilUsuario(user) {
      const { data: profile, error } = await _supabase.from('profiles').select('role, active, nome').eq('id', user.id).single();
      if (error || !profile || !profile.active) { await _supabase.auth.signOut(); return null; }
      return profile;
    }

    async function executarLogin(email, senha, btnElement) {
      const textoOriginal = btnElement.innerHTML; btnElement.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
      document.getElementById("msgErroLogin").classList.add("hidden");
      const { data, error } = await _supabase.auth.signInWithPassword({ email, password: senha });
      if (error) { document.getElementById("msgErroLogin").classList.remove("hidden"); btnElement.innerHTML = textoOriginal; return; }
      const profile = await carregarPerfilUsuario(data.user);
      if (!profile) { document.getElementById("msgErroLogin").classList.remove("hidden"); btnElement.innerHTML = textoOriginal; return; }
      currentUser = data.user; currentProfile = profile; ROLE = profile.role.toUpperCase(); iniciarApp();
    }

    function loginCompras() { const s = document.getElementById("senhaCompras").value; executarLogin('compras@ejcbank.com.br', s, document.getElementById('btnCompras')); }
    function loginPiloto() { const e = document.getElementById("emailPiloto").value.trim().toLowerCase(); const s = document.getElementById("senhaPiloto").value; executarLogin(e, s, document.getElementById('btnPiloto')); }

    function iniciarApp() {
      document.getElementById("loginScreen").classList.add("hidden"); document.getElementById("appMain").classList.remove("hidden");
      document.getElementById("userAvatar").innerText = (currentProfile?.nome || ROLE).charAt(0).toUpperCase();
      if (ROLE === "ADMIN") {
        document.querySelectorAll("#tab-admin, #tab-feijoada, #tab-doacao, #dashAdmin, #blocoPDF").forEach(el => el.classList.remove("hidden"));
        document.getElementById("headerTitle").innerText = "EJC BANK PILOTOS";
        abaAtiva = "ADMIN";
      } else { 
        document.getElementById("headerTitle").innerText = "EJC BANK COMPRAS";
        abaAtiva = "EJC"; 
      }
      mudarAba(abaAtiva);
    }

    async function mudarAba(a) {
      abaAtiva = a; document.querySelectorAll(".tab-btn").forEach(b => {
        const isSelected = b.id === "tab-" + a.toLowerCase();
        b.classList.toggle("bg-white", isSelected); b.classList.toggle("text-slate-900", isSelected);
        b.classList.toggle("bg-white/5", !isSelected); b.classList.toggle("text-slate-400", !isSelected);
      });
      const isAdminDoacao = (abaAtiva === "DOACAO" && ROLE === "ADMIN");
      const blocoDoacao = document.getElementById("blocoAdminDoacao");
      if (blocoDoacao) blocoDoacao.classList.toggle("hidden", !isAdminDoacao);
      if (isAdminDoacao) carregarMetasAdmin();

      const cardSaldo = document.getElementById("cardSaldoLiquido"), dashGrid = document.getElementById("dashGrid");
      if (cardSaldo && dashGrid) {
          if (abaAtiva === "ADMIN") { cardSaldo.classList.remove("hidden"); dashGrid.className = "grid grid-cols-1 sm:grid-cols-4 gap-8"; }
          else { cardSaldo.classList.add("hidden"); dashGrid.className = "grid grid-cols-1 sm:grid-cols-3 gap-8"; }
      }
      await carregarDados();
    }

    async function carregarDados() {
      document.getElementById("loading").classList.remove("hidden");
      let query = _supabase.from('transacoes').select('*').order('criado_em', { ascending: false });
      if (abaAtiva !== "ADMIN") query = query.eq('modulo', abaAtiva);
      const { data } = await query; dadosCache = data || [];
      atualizarStats(); renderizar(); document.getElementById("loading").classList.add("hidden");
    }

    function atualizarStats() {
      let rec = 0, pen = 0, sai = 0;
      dadosCache.forEach(i => {
        const v = parseFloat(i.valor || 0);
        if (i.natureza === "SAIDA") sai += v; else if (i.status === "PENDENTE") pen += v; else rec += v;
      });
      document.getElementById("totalRecebido").innerText = "R$ " + rec.toLocaleString('pt-BR', {minimumFractionDigits: 2});
      document.getElementById("totalPendente").innerText = "R$ " + pen.toLocaleString('pt-BR', {minimumFractionDigits: 2});
      document.getElementById("totalSaidas").innerText = "R$ " + sai.toLocaleString('pt-BR', {minimumFractionDigits: 2});
      document.getElementById("totalLiquido").innerText = "R$ " + (rec - sai).toLocaleString('pt-BR', {minimumFractionDigits: 2});
    }

    function renderizar() {
      const tb = document.getElementById("corpoTabela"); tb.innerHTML = "";
      const busca = document.getElementById("campoBusca").value.toLowerCase();
      dadosCache.filter(i => ((i.descricao || "") + (i.nome_pessoa || "")).toLowerCase().includes(busca)).forEach(i => {
        const val = parseFloat(i.valor || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2});
        const iconClass = i.modulo === "DOACAO" ? "bg-indigo-500" : i.natureza === "SAIDA" ? "bg-rose-500" : i.status === "PENDENTE" ? "bg-amber-500" : "bg-emerald-500";
        tb.innerHTML += `<tr class="hover:bg-slate-50 border-b border-slate-50 last:border-0"><td class="p-6"><p class="text-sm font-bold text-slate-900">${esc(i.descricao)}</p><p class="text-[10px] text-slate-400 uppercase tracking-widest mt-1">${esc(i.nome_pessoa) || "---"} ${i.equipe ? ' • '+esc(i.equipe) : ""}</p></td><td class="p-6 text-right font-extrabold text-slate-900">R$ ${val}</td><td class="p-6 text-center"><span class="w-1.5 h-1.5 rounded-full ${iconClass} inline-block"></span></td><td class="p-6 text-right">${i.status === 'PENDENTE' ? `<button onclick="baixar('${i.id}', ${i.version})" class="w-9 h-9 rounded-lg bg-slate-900 text-white shadow-lg"><i class="fas fa-check text-[10px]"></i></button>` : ""}</td></tr>`;
      });
    }

    async function carregarMetasAdmin() {
        const container = document.getElementById("listaGerenciarMetas");
        container.innerHTML = '<p class="text-xs text-slate-400 font-bold text-center">Syncing Targets...</p>';
        const { data } = await _supabase.from('metas_doacao').select('*').eq('ativo', true).order('criado_em', { ascending: false });
        if (!data || data.length === 0) { container.innerHTML = '<p class="text-xs text-slate-400 font-bold text-center">No active targets.</p>'; return; }
        container.innerHTML = '<p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-4">Target Management</p>';
        data.forEach(m => {
            container.innerHTML += `<div class="flex justify-between items-center bg-slate-50 p-5 rounded-2xl border border-slate-100">
                <div><p class="text-sm font-extrabold text-slate-900">${esc(m.item)}</p><p class="text-[10px] text-slate-500">Volume: ${m.qtd_necessaria} ${esc(m.unidade)}</p></div>
                <button onclick="excluirMeta('${m.id}')" class="w-10 h-10 bg-white text-slate-400 rounded-xl flex items-center justify-center hover:bg-rose-50 hover:text-rose-500 transition"><i class="fas fa-trash-can text-xs"></i></button></div>`;
        });
    }

    async function excluirMeta(id) { if (confirm("Terminate target?")) { await _supabase.from('metas_doacao').delete().eq('id', id); carregarMetasAdmin(); } }
    async function salvarMeta() {
        const item = document.getElementById("m_item").value, qtd = parseInt(document.getElementById("m_qtd").value), un = document.getElementById("m_un").value;
        const { error } = await _supabase.from('metas_doacao').insert([{ item, qtd_necessaria: qtd, unidade: un }]);
        if (!error) { showToast("Target Established"); document.getElementById("modalMeta").classList.add("hidden"); document.getElementById("formMeta").reset(); carregarMetasAdmin(); }
    }

    document.getElementById("formFin").addEventListener("submit", async function(e) {
      e.preventDefault();
      const type = document.getElementById("f_type").value, val = parseFloat(document.getElementById("f_val").value), mod = abaAtiva === "ADMIN" ? document.getElementById("f_modulo").value : abaAtiva;
      let eqp = ""; if (mod === "MERCADINHO") { eqp = document.getElementById("f_tipo_pessoa").value === "SERVO" ? document.getElementById("f_equipe_merc").value : "GUEST"; }
      const { error } = await _supabase.from('transacoes').insert([{ modulo: mod, descricao: document.getElementById("f_desc").value, valor: val, quantidade: 1, natureza: type === "SAIDA" ? "SAIDA" : "ENTRADA", status: type === "PENDENTE" ? "PENDENTE" : "PAGO", forma_pagamento: document.getElementById("f_forma").value, nome_pessoa: document.getElementById("f_nome").value, equipe: eqp, telefone: document.getElementById("f_tel").value.replace(/\D/g,""), recebido_por: document.getElementById("f_recebido").value, user_id: currentUser.id }]);
      if (!error) { showToast("Transaction Authorized"); fecharModal(); carregarDados(); }
    });

    async function baixar(id, ver) { if (confirm("Settle Transaction?")) { await _supabase.from('transacoes').update({ status: 'PAGO' }).eq('id', id).eq('version', ver); carregarDados(); } }

    function gerarPDFRelatorio() {
      const { jsPDF } = window.jspdf; const doc = new jsPDF();
      doc.setFontSize(18); doc.text("EJC BANK • FINANCIAL STATEMENT", 14, 20);
      doc.save("Ledger_EJC.pdf");
    }

    function controlarTipoPessoa() {
        const tipo = document.getElementById("f_tipo_pessoa").value, eqp = document.getElementById("f_equipe_merc"), stat = document.getElementById("f_type"), optF = stat.querySelector('option[value="PENDENTE"]');
        if (tipo === "PAROQUIANO") { eqp.classList.add("hidden"); stat.value = "ENTRADA"; optF.disabled = true; } else { eqp.classList.remove("hidden"); optF.disabled = false; }
    }

    function abrirModal() {
      document.getElementById("modal").classList.remove("hidden");
      const isM = (abaAtiva === "MERCADINHO"); document.getElementById("camposMercado").classList.toggle("hidden", !isM);
      if (isM) controlarTipoPessoa(); document.getElementById("blocoModulo").classList.toggle("hidden", abaAtiva !== "ADMIN");
    }

    function fecharModal() { document.getElementById("modal").classList.add("hidden"); document.getElementById("formFin").reset(); }
    async function sair() { await _supabase.auth.signOut(); location.reload(); }

    window.onload = async () => {
      mudarAbaLogin('compras');
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) { const p = await carregarPerfilUsuario(session.user); if (p) { currentUser = session.user; currentProfile = p; ROLE = p.role.toUpperCase(); iniciarApp(); } }
    };
  </script>
</body>
</html>

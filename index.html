<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EJC BANK • NuStyle</title>
  
  <link rel="preconnect" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://script.google.com">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    /* ===== NU STYLE (ROXO FINTECH) ===== */
    :root { --nu-roxo: #820ad1; --nu-roxo-dark: #6105a0; --nu-bg: #f5f5f7; }
    body { font-family: 'Inter', sans-serif; background-color: var(--nu-bg); width: 100%; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
    
    /* Header Nubank */
    .nu-header { background: var(--nu-roxo); color: white; padding-bottom: 10px; box-shadow: 0 4px 20px rgba(130, 10, 209, 0.2); }
    
    /* Botões & Interação */
    button { transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
    button:active { transform: scale(0.96); }
    
    /* Cards Flutuantes */
    .nu-card { background: white; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.03); }
    
    /* Tabela Clean */
    .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 100px; }
    table { width: 100%; min-width: 600px; border-spacing: 0; }
    tr { border-bottom: 1px solid #f0f0f5; }
    tr:last-child { border-bottom: none; }
    
    /* Botão Flutuante (FAB) */
    .fab { position: fixed; bottom: 24px; right: 24px; width: 64px; height: 64px; background: var(--nu-roxo); color: white; border-radius: 50%; box-shadow: 0 10px 25px rgba(130, 10, 209, 0.4); display: flex; align-items: center; justify-content: center; font-size: 24px; z-index: 50; transition: all 0.3s; }
    .fab:active { transform: scale(0.9) rotate(90deg); }

    /* Toast Notification */
    #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
    .toast { background: #262626; color: white; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .admin-only { display: none; }
    .hidden { display: none !important; }
    .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>

<body class="text-slate-800 min-h-screen flex flex-col">

<div id="toast-container"></div>

<div id="loginScreen" class="fixed inset-0 z-[999] flex items-center justify-center px-6 bg-slate-900/95 backdrop-blur-sm">
  <div class="relative w-full max-w-sm bg-white rounded-[32px] shadow-2xl p-8 animate-fade-in-up">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-slate-800 tracking-tight">EJC <span class="text-purple-600">BANK</span></h1>
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-2">Gestão Financeira 21º EJC</p>
    </div>
    
    <div class="relative mb-4 group">
        <input type="password" id="inputSenha" placeholder="Senha de Acesso" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl px-4 py-4 font-bold outline-none focus:border-purple-600 focus:bg-white transition text-slate-700 text-center">
    </div>
    
    <div class="grid grid-cols-2 gap-3 mb-4">
        <button onclick="tentarLogin('admin')" class="py-4 rounded-2xl font-black text-white bg-slate-800 hover:bg-slate-900 shadow-lg shadow-slate-200">👑 PILOTOS</button>
        <button onclick="tentarLogin('compras')" class="py-4 rounded-2xl font-black text-white bg-purple-600 hover:bg-purple-700 shadow-lg shadow-purple-200">🛒 COMPRAS</button>
    </div>
    
    <p id="msgErroLogin" class="hidden text-rose-500 text-xs font-bold text-center animate-pulse">⛔ Senha incorreta</p>
  </div>
</div>

<div id="appMain" class="hidden flex-1 flex flex-col max-w-6xl mx-auto w-full">
  
  <header class="nu-header sticky top-0 z-40">
    <div class="px-5 py-4 flex justify-between items-center">
        <div>
            <h1 id="headerTitle" class="font-black text-lg tracking-wide uppercase">EJC BANK</h1>
        </div>
        <div class="text-right">
            <p class="text-[9px] font-bold opacity-70 tracking-widest uppercase">Encontro</p>
            <p class="font-black text-sm">21º EJC</p>
        </div>
    </div>

    <div class="mt-2 px-5 overflow-x-auto no-scrollbar flex gap-5 pb-2">
        <button id="tab-admin" onclick="mudarAba('admin')" class="tab-btn text-white/70 hover:text-white font-bold text-sm whitespace-nowrap admin-only transition">📊 Visão Geral</button>
        <button id="tab-ejc" onclick="mudarAba('ejc')" class="tab-btn text-white font-black text-sm whitespace-nowrap border-b-2 border-white pb-1 transition">⛪ EJC</button>
        <button id="tab-mercadinho" onclick="mudarAba('mercadinho')" class="tab-btn text-white/70 hover:text-white font-bold text-sm whitespace-nowrap transition">🛒 Mercadinho</button>
        <button id="tab-feijoada" onclick="mudarAba('feijoada')" class="tab-btn text-white/70 hover:text-white font-bold text-sm whitespace-nowrap admin-only transition">🍛 Feijoada</button>
        <button id="tab-arquivo" onclick="mudarAba('arquivo')" class="tab-btn text-white/70 hover:text-white font-bold text-sm whitespace-nowrap admin-only transition">📦 Arquivo</button>
    </div>
  </header>

  <main class="px-4 py-6 -mt-2 z-30 relative bg-transparent">
    
    <div id="dashAdmin" class="bg-white rounded-3xl p-6 shadow-xl mb-6 grid grid-cols-1 sm:grid-cols-3 gap-6 admin-only animate-fade-in-up border border-slate-100">
       <div><p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Total Recebido</p><h2 id="totalRecebido" class="text-3xl font-black text-slate-800">R$ 0,00</h2></div>
       <div><p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">A Receber</p><h2 id="totalPendente" class="text-3xl font-black text-orange-500">R$ 0,00</h2></div>
       <div><p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Saldo Líquido</p><h2 id="totalLiquido" class="text-3xl font-black text-purple-600">R$ 0,00</h2></div>
    </div>

    <div id="filtrosEJC" class="hidden flex gap-2 mb-4 overflow-x-auto no-scrollbar pb-1">
        <button onclick="filtrarDia('Sexta')" class="flex-1 bg-white text-slate-600 py-3 px-6 rounded-2xl text-xs font-bold shadow-sm whitespace-nowrap">Sexta</button>
        <button onclick="filtrarDia('Sabado')" class="flex-1 bg-white text-slate-600 py-3 px-6 rounded-2xl text-xs font-bold shadow-sm whitespace-nowrap">Sábado</button>
        <button onclick="filtrarDia('Domingo')" class="flex-1 bg-white text-slate-600 py-3 px-6 rounded-2xl text-xs font-bold shadow-sm whitespace-nowrap">Domingo</button>
    </div>
    
    <div id="filtrosMercadinho" class="hidden flex gap-2 mb-4 overflow-x-auto no-scrollbar pb-1">
        <button onclick="filtrarCampanha('[MÃES]')" class="flex-1 bg-white text-pink-600 py-3 px-6 rounded-2xl text-xs font-bold shadow-sm whitespace-nowrap">🌸 Mães</button>
        <button onclick="filtrarCampanha('[NAMORADOS]')" class="flex-1 bg-white text-rose-600 py-3 px-6 rounded-2xl text-xs font-bold shadow-sm whitespace-nowrap">💘 Namorados</button>
        <button onclick="filtrarCampanha('Geral')" class="flex-1 bg-white text-emerald-600 py-3 px-6 rounded-2xl text-xs font-bold shadow-sm whitespace-nowrap">🛒 Geral</button>
    </div>

    <div id="alertaDomingo" class="hidden bg-slate-800 text-white p-5 rounded-3xl shadow-xl mb-6 flex flex-col md:flex-row justify-between items-center gap-4 animate-fade-in-up">
        <div class="flex items-center gap-4"><div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center"><i class="fas fa-hand-holding-dollar"></i></div><div><h3 class="font-black uppercase text-sm">COBRANÇA</h3><p id="txtTotalCobranca" class="text-xs font-bold opacity-70">Calculando...</p></div></div>
        <div class="flex gap-2 w-full md:w-auto"><button onclick="copiarRelatorioCobranca()" class="bg-white/10 px-4 py-3 rounded-xl text-xs font-bold flex-1">Relatório</button><button onclick="pagarTudoDomingo()" class="bg-white text-slate-900 px-4 py-3 rounded-xl text-xs font-black shadow-md flex-1">BAIXAR TUDO</button></div>
    </div>

    <div class="nu-card overflow-hidden mb-20">
        <div class="p-4 border-b border-slate-50 flex gap-2 items-center">
            <i class="fas fa-search text-slate-300"></i>
            <input id="campoBusca" onkeyup="renderizar()" placeholder="Buscar lançamentos..." class="w-full text-sm font-semibold outline-none text-slate-700 placeholder:text-slate-300">
        </div>
        <div id="loading" class="hidden py-10 text-center"><div class="animate-spin inline-block w-8 h-8 border-4 border-slate-100 border-t-purple-600 rounded-full"></div></div>
        
        <div class="table-wrapper">
            <table class="text-left text-sm w-full">
                <thead class="text-[10px] font-black text-slate-400 uppercase bg-slate-50"><tr class=""><th class="p-4">Detalhes</th><th class="p-4 text-right">Valor</th><th class="p-4 text-center">Status</th><th class="p-4 text-center">Ação</th></tr></thead>
                <tbody id="corpoTabela" class="text-slate-600 font-medium"></tbody>
            </table>
        </div>
    </div>
  </main>

  <button onclick="abrirModal()" class="fab hover:scale-110 active:scale-95"><i class="fas fa-plus"></i></button>

</div>

<div id="modal" class="hidden fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="fecharModal()"></div>
  <div class="relative bg-white w-full max-w-lg rounded-t-[32px] sm:rounded-[32px] p-6 shadow-2xl max-h-[90vh] overflow-y-auto animate-fade-in-up">
    
    <button onclick="fecharModal()" class="absolute top-6 right-6 text-slate-300 hover:text-slate-800 text-xl transition z-50"><i class="fas fa-times"></i></button>

    <h2 class="text-xl font-black text-slate-800 mb-6">Novo Lançamento</h2>
    <form id="formFin" class="space-y-4">
        
        <div class="flex gap-3">
            <div class="flex-1 bg-slate-50 rounded-2xl px-4 py-3 border border-slate-100 focus-within:border-purple-500 focus-within:bg-white transition">
                <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Item</label>
                <input id="f_desc" placeholder="Ex: Coxinha" class="w-full bg-transparent font-bold text-slate-800 outline-none">
            </div>
        </div>
        
        <div class="flex gap-3">
            <div class="flex-[2] bg-slate-50 rounded-2xl px-4 py-3 border border-slate-100 focus-within:border-purple-500 focus-within:bg-white transition">
                <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Valor Unitário</label>
                <input id="f_val" type="number" step="0.01" placeholder="R$ 0,00" class="w-full bg-transparent font-bold text-slate-800 outline-none">
            </div>
            <button type="button" onclick="somarItem()" class="flex-1 bg-purple-50 text-purple-600 rounded-2xl font-black text-xl hover:bg-purple-100 transition">+</button>
        </div>
        
        <div id="areaCesta" class="hidden bg-purple-50 p-4 rounded-2xl border border-purple-100">
            <div id="listaItens" class="text-xs space-y-2 mb-3 max-h-32 overflow-y-auto"></div>
            <div class="flex justify-between items-center border-t border-purple-200 pt-3">
                <button type="button" onclick="limparCesta()" class="text-[10px] text-rose-500 font-bold uppercase hover:underline">Limpar</button>
                <p id="txtSoma" class="text-base font-black text-purple-800">Total: R$ 0.00</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <select id="f_forma" class="bg-slate-50 border border-slate-100 rounded-2xl px-4 py-3 font-bold text-slate-700 outline-none"><option value="PIX">PIX</option><option value="DINHEIRO">DINHEIRO</option><option value="CARTAO">CARTAO</option></select>
            <select id="f_type" class="bg-slate-50 border border-slate-100 rounded-2xl px-4 py-3 font-bold text-slate-700 outline-none"><option value="ENTRADA">Pago ✅</option><option value="PENDENTE">Fiado 🟠</option><option value="SAIDA">Custo 🔴</option></select>
        </div>

        <div id="blocoTroco" class="hidden bg-emerald-50 p-4 rounded-2xl border border-emerald-100 space-y-2">
            <p class="text-[10px] font-black text-emerald-600 uppercase">Troco</p>
            <input id="f_pago" type="number" step="0.01" placeholder="Recebido do cliente?" class="w-full bg-white border border-emerald-200 p-2 rounded-xl font-bold text-center">
            <p id="txtTroco" class="text-center font-black text-emerald-700">Troco: R$ 0,00</p>
        </div>
        
        <div id="camposEJC" class="hidden bg-blue-50 p-4 rounded-2xl space-y-3"><p class="text-[10px] font-black text-blue-400 uppercase text-center">EJC</p><select id="f_dia" class="w-full bg-white border-0 p-3 rounded-xl font-bold text-center text-sm shadow-sm"><option value="Sexta">Sexta</option><option value="Sabado">Sábado</option><option value="Domingo">Domingo</option></select><select id="f_equipe" class="w-full bg-white border-0 p-3 rounded-xl font-bold text-center text-sm shadow-sm"><option value="">Equipe...</option><option>Animação</option><option>Patrimônio</option><option>Café</option><option>Círculo</option><option>Compras</option><option>Cozinha</option><option>Intercessão</option><option>Liturgia</option><option>Ordem</option><option>Piloto</option><option>Sala</option><option>Secretaria</option><option>Som/Luz</option><option>Trânsito</option><option>Visitação</option></select></div>
        
        <div id="camposMercado" class="hidden bg-pink-50 p-4 rounded-2xl space-y-3">
            <p class="text-[10px] font-black text-pink-400 uppercase text-center">Mercadinho</p>
            <select id="f_tipo_pessoa" class="w-full bg-white border-0 p-3 rounded-xl font-bold text-center text-sm shadow-sm"><option value="PAROQUIANO">👤 Paroquiano (Sem Equipe)</option><option value="SERVO">🙋‍♂️ Servo do EJC</option></select>
            <select id="f_campanha" class="w-full bg-white border-0 p-3 rounded-xl font-bold text-center text-sm shadow-sm"><option value="GERAL">🛒 Geral</option><option value="MAES">🌸 Mães</option><option value="NAMORADOS">💘 Namorados</option></select>
            <select id="f_equipe_merc" class="hidden w-full bg-white border-0 p-3 rounded-xl font-bold text-center text-sm shadow-sm"><option value="">Equipe...</option><option>Animação</option><option>Patrimônio</option><option>Café</option><option>Círculo</option><option>Compras</option><option>Cozinha</option><option>Intercessão</option><option>Liturgia</option><option>Ordem</option><option>Piloto</option><option>Sala</option><option>Secretaria</option><option>Som/Luz</option><option>Trânsito</option><option>Visitação</option></select>
        </div>
        
        <div id="camposFeijoada" class="hidden bg-orange-50 p-4 rounded-2xl space-y-3">
            <p class="text-[10px] font-black text-orange-400 uppercase text-center">Feijoada</p>
            <div class="grid grid-cols-2 gap-2">
                <input id="f_qtd" type="number" value="1" class="w-full bg-white border-0 p-3 rounded-xl font-bold text-center text-sm shadow-sm" placeholder="Qtd">
                <select id="f_equipe_feijoada" class="w-full bg-white border-0 p-3 rounded-xl font-bold text-center text-sm shadow-sm"><option value="">Sem Equipe</option><option>Animação</option><option>Patrimônio</option><option>Café</option><option>Círculo</option><option>Compras</option><option>Cozinha</option><option>Intercessão</option><option>Liturgia</option><option>Ordem</option><option>Piloto</option><option>Sala</option><option>Secretaria</option><option>Som/Luz</option><option>Trânsito</option><option>Visitação</option></select>
            </div>
            <input id="f_comun" placeholder="Comunidade" class="w-full bg-white border-0 p-3 rounded-xl font-bold text-center uppercase text-sm shadow-sm">
            <input id="f_obs" placeholder="Obs" class="w-full bg-white border-0 p-3 rounded-xl font-bold text-center text-xs shadow-sm">
        </div>

        <div class="bg-slate-50 rounded-2xl px-4 py-3 border border-slate-100 focus-within:border-purple-500 focus-within:bg-white transition">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Nome da Pessoa</label>
            <input id="f_nome" class="w-full bg-transparent font-bold text-slate-800 outline-none">
        </div>
        
        <div class="bg-slate-50 rounded-2xl px-4 py-3 border border-slate-100 focus-within:border-purple-500 focus-within:bg-white transition">
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">WhatsApp</label>
            <input id="f_tel" class="w-full bg-transparent font-bold text-slate-800 outline-none">
        </div>
        
        <div class="bg-purple-50 rounded-2xl px-4 py-3 border border-purple-100 focus-within:border-purple-500 focus-within:bg-white transition">
            <label class="text-[10px] font-bold text-purple-400 uppercase block mb-1">Quem Recebeu? (Obrigatório)</label>
            <input id="f_recebido" class="w-full bg-transparent font-bold text-purple-900 outline-none">
        </div>

        <button type="submit" class="w-full bg-purple-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-purple-200 mt-4 active:scale-95 transition text-lg">SALVAR</button>
    </form>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzfCozUPEax76bamW5DgxDgEOK9LCw4OCsppEKbm_lGOTmXBGCs0bjHAFQRFzEi1Tl4Jw/exec";
const PASS_ADMIN="@admpilotos2026#", PASS_COMPRAS="$compras2026";
let ROLE="", abaAtiva="admin", filtroAtivo="", dadosCache=[];
let dadosAdminCache = [];
let itensCesta = []; 

function toggleSenha(){ const i=document.getElementById("inputSenha"); const ic=document.getElementById("lockIcon"); i.type=i.type==="password"?"text":"password"; ic.className=i.type==="password"?"fas fa-eye":"fas fa-eye-slash"; }

function showToast(msg, type="success"){
    const t = document.createElement("div"); t.className="toast";
    t.innerHTML = type==="error" ? `<i class="fas fa-times-circle text-rose-400"></i> ${msg}` : `<i class="fas fa-check-circle text-emerald-400"></i> ${msg}`;
    document.getElementById("toast-container").appendChild(t);
    if(navigator.vibrate) navigator.vibrate(50);
    setTimeout(()=>t.remove(), 3000);
}

function tentarLogin(r){
    const s=document.getElementById("inputSenha").value;
    if(r==="admin" && s===PASS_ADMIN) ROLE="admin";
    else if(r==="compras" && s===PASS_COMPRAS) ROLE="compras";
    else return document.getElementById("msgErroLogin").classList.remove("hidden");
    
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("appMain").classList.remove("hidden");
    
    // ✅ HEADER DINÂMICO
    const headerTitle = document.getElementById("headerTitle");
    if(ROLE==="admin") headerTitle.innerText = "EJC BANK PILOTOS";
    else headerTitle.innerText = "EJC BANK COMPRAS";
    
    if(ROLE==="compras") { 
        abaAtiva="ejc"; 
        document.getElementById("tab-admin").classList.add("hidden");
        document.getElementById("tab-feijoada").classList.add("hidden"); 
        document.getElementById("tab-arquivo").classList.add("hidden");
    }
    if(ROLE==="admin") { document.querySelectorAll(".admin-only").forEach(el => el.style.display = "block"); }
    mudarAba(abaAtiva);
}

function mudarAba(a){
    abaAtiva=a; filtroAtivo="";
    
    // RESET VISUAL DOS BOTÕES
    document.querySelectorAll(".tab-btn").forEach(b=>{
        b.classList.remove("text-white", "font-black", "border-white", "opacity-100");
        b.classList.add("text-white/70", "font-bold", "border-transparent");
    });
    
    // ATIVA O BOTÃO CLICADO
    const btn = document.getElementById("tab-"+a);
    if(btn){
        btn.classList.add("text-white", "font-black", "border-white", "opacity-100");
        btn.classList.remove("text-white/70", "border-transparent");
    }

    document.getElementById("filtrosEJC").classList.toggle("hidden", a!=="ejc");
    document.getElementById("filtrosMercadinho").classList.toggle("hidden", a!=="mercadinho");
    document.getElementById("painelArquivo").classList.toggle("hidden", a!=="arquivo");
    if(ROLE !== "admin") { document.getElementById("dashAdmin").classList.add("hidden"); } 
    else { document.getElementById("dashAdmin").classList.toggle("hidden", a!=="admin"); }
    carregar();
}

function filtrarDia(d){ filtroAtivo=d; renderizar(); }
function filtrarCampanha(c){ filtroAtivo=c; renderizar(); }

async function carregar(){
    document.getElementById("loading").classList.remove("hidden");
    try {
        if (ROLE === "admin") {
            const [rAdmin, rCompras, rFeijoada] = await Promise.all([
                fetch(`${API}?action=listarAdminFull`).then(r => r.json()),
                fetch(`${API}?action=listarCompras`).then(r => r.json()),
                fetch(`${API}?action=listarFeijoada`).then(r => r.json())
            ]);
            dadosAdminCache = [...rAdmin, ...rCompras, ...rFeijoada];
            atualizarStats();
        }
        let act = "listarAdminFull";
        if (abaAtiva==="ejc" || abaAtiva==="mercadinho") act = "listarCompras";
        if (abaAtiva==="feijoada") act = "listarFeijoada";
        if (abaAtiva==="arquivo") act = "listarArquivo";
        const r = await fetch(`${API}?action=${act}`);
        dadosCache = await r.json();
        renderizar();
    } catch(e){ showToast("Erro conexão", "error"); }
    document.getElementById("loading").classList.add("hidden");
}

setInterval(() => {
    if(document.visibilityState === "visible" && !document.getElementById("modal").classList.contains("hidden") === false){
        carregar();
    }
}, 10000);

function atualizarStats(){
    let rec = 0, pen = 0;
    dadosAdminCache.forEach(i => {
        let v = parseFloat(i.amount || i.total || 0);
        if(i.paid) rec += v; else pen += v;
    });
    document.getElementById("totalRecebido").innerText = "R$ " + rec.toFixed(2);
    document.getElementById("totalPendente").innerText = "R$ " + pen.toFixed(2);
    document.getElementById("totalLiquido").innerText = "R$ " + (rec - pen).toFixed(2);
}

function renderizar(){
    const tb=document.getElementById("corpoTabela"); tb.innerHTML="";
    const busca = document.getElementById("campoBusca").value.toLowerCase();
    const lista = dadosCache.slice(-150).reverse().filter(i=>{
        const pOriginal = i.product || i.description || "";
        const p = pOriginal.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); 
        if(abaAtiva==="ejc") {
            if(i.category!=="EJC") return false;
            if(filtroAtivo && i.ejc_dia !== filtroAtivo) return false;
        }
        if(abaAtiva==="mercadinho") {
            if(i.category!=="Mercadinho") return false; 
            if(filtroAtivo==="Geral" && (p.includes("MAES") || p.includes("NAMORADOS"))) return false;
            else if(filtroAtivo && !p.includes(filtroAtivo.replace(/[\[\]]/g,"").normalize("NFD").replace(/[\u0300-\u036f]/g, ""))) return false;
        }
        const txt = (pOriginal).toLowerCase() + (i.buyer_name||"").toLowerCase();
        if(busca && !txt.includes(busca)) return false;
        if(ROLE==="compras" && new Date().getDay()===0 && abaAtiva==="ejc" && i.paid) return false;
        return true;
    });

    lista.forEach(i=>{
        const desc = i.product || i.description || "Item"; 
        const val = parseFloat(i.amount||i.total||0);
        const dataShow = abaAtiva==="arquivo" ? `${new Date(i.data_backup).toLocaleDateString()}<br>${i.origem}` : new Date(i.date).toLocaleDateString();
        const btnArquivo = (ROLE==="admin" && abaAtiva!=="arquivo") ? `<button onclick="arquivarInd('${i.id}')" class="text-slate-300 hover:text-purple-600 transition p-2"><i class="fas fa-box"></i></button>` : "";

        tb.innerHTML += `
        <tr>
            <td class="p-4">
                <p class="text-xs font-bold text-slate-800">${desc}</p>
                <p class="text-[10px] text-slate-400 font-medium mt-0.5">${i.buyer_name||"Anônimo"} ${i.equipe?"• "+i.equipe:""}</p>
                <p class="text-[9px] text-slate-300 mt-1">${dataShow}</p>
            </td>
            <td class="p-4 text-right font-black text-slate-800 whitespace-nowrap">R$ ${val.toFixed(2)}</td>
            <td class="p-4 text-center">
                ${i.paid ? '<div class="inline-flex items-center justify-center w-8 h-8 bg-emerald-100 text-emerald-600 rounded-full"><i class="fas fa-check text-xs"></i></div>' : '<div class="inline-flex items-center justify-center w-8 h-8 bg-orange-100 text-orange-500 rounded-full"><i class="fas fa-clock text-xs"></i></div>'}
            </td>
            <td class="p-4 text-center whitespace-nowrap">
                <div class="flex items-center justify-center gap-2">
                    ${!i.paid && abaAtiva!=="arquivo" ? `<button onclick="baixar('${i.id}')" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-emerald-500 hover:text-white transition"><i class="fas fa-check"></i></button>` : ""}
                    ${!i.paid && i.phone ? `<button onclick="cobrarZapTotal('${i.phone}','${i.buyer_name}')" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-green-500 hover:text-white transition"><i class="fab fa-whatsapp"></i></button>` : ""}
                    ${btnArquivo}
                </div>
            </td>
        </tr>`;
    });

    if(ROLE==="compras" && ehDomingo && abaAtiva==="ejc" && somaPend > 0) {
        document.getElementById("alertaDomingo").classList.remove("hidden");
        document.getElementById("txtTotalCobranca").innerText = `A RECEBER: R$ ${somaPend.toFixed(2)}`;
    } else { document.getElementById("alertaDomingo").classList.add("hidden"); }
}

function somarItem(){
    const descInput = document.getElementById("f_desc").value.trim();
    const desc = descInput || "Item Diverso";
    const val = parseFloat(document.getElementById("f_val").value);
    if(!val || val <= 0) return showToast("Valor inválido", "error");
    const itemExistente = itensCesta.find(i => i.desc.toLowerCase() === desc.toLowerCase() && i.val === val);
    if (itemExistente) { itemExistente.qtd += 1; } else { itensCesta.push({ desc: desc, val: val, qtd: 1 }); }
    renderCesta();
    document.getElementById("f_desc").value = ""; 
    document.getElementById("f_desc").focus(); 
    calcularTroco();
}

function renderCesta(){
    const lista = document.getElementById("listaItens");
    lista.innerHTML = "";
    let total = 0;
    if(itensCesta.length === 0){ document.getElementById("areaCesta").classList.add("hidden"); document.getElementById("txtSoma").innerText = "Total: R$ 0.00"; return; }
    itensCesta.forEach((item) => {
        const subtotal = item.val * item.qtd;
        total += subtotal;
        lista.innerHTML += `<div class="flex justify-between border-b border-purple-100 pb-2 text-xs"><span><b class="text-purple-600">${item.qtd}x</b> ${item.desc}</span><span class="font-bold text-slate-700">R$ ${subtotal.toFixed(2)}</span></div>`;
    });
    document.getElementById("txtSoma").innerText = `Total: R$ ${total.toFixed(2)}`;
    document.getElementById("areaCesta").classList.remove("hidden");
}

function limparCesta(){ itensCesta = []; renderCesta(); calcularTroco(); }

document.getElementById("f_forma").addEventListener("change", () => {
    const forma = document.getElementById("f_forma").value;
    document.getElementById("blocoTroco").classList.toggle("hidden", forma !== "DINHEIRO");
});
document.getElementById("f_pago").addEventListener("input", calcularTroco);
document.getElementById("f_val").addEventListener("input", calcularTroco);

document.getElementById("f_tipo_pessoa")?.addEventListener("change", controlarTipoPessoa);
function controlarTipoPessoa() {
    const tipo = document.getElementById("f_tipo_pessoa").value;
    const equipe = document.getElementById("f_equipe_merc");
    const tipoPg = document.getElementById("f_type");
    const optionPendente = tipoPg.querySelector('option[value="PENDENTE"]');
    if (tipo === "PAROQUIANO") {
        equipe.classList.add("hidden"); equipe.value = "";
        tipoPg.value = "ENTRADA"; optionPendente.disabled = true; optionPendente.innerText = "🟠 Pendente (Bloqueado)";
    } else {
        equipe.classList.remove("hidden"); optionPendente.disabled = false; optionPendente.innerText = "🟠 Pendente (Fiado)";
    }
}

function calcularTroco(){
    const totalCestaVal = itensCesta.reduce((acc, i) => acc + (i.val * i.qtd), 0);
    const valCampo = parseFloat(document.getElementById("f_val").value || 0);
    const totalFinal = totalCestaVal > 0 ? totalCestaVal : valCampo;
    const pago = parseFloat(document.getElementById("f_pago").value || 0);
    let troco = pago - totalFinal;
    if(troco < 0) troco = 0;
    document.getElementById("txtTroco").innerText = "Troco: R$ " + troco.toFixed(2);
}

document.getElementById("formFin").addEventListener("submit", async function(e){
    e.preventDefault();
    let finalDesc = document.getElementById("f_desc").value;
    let finalVal = parseFloat(document.getElementById("f_val").value);
    let finalQtd = 1;
    if(itensCesta.length > 0) {
        finalDesc = itensCesta.map(i => `${i.qtd}x ${i.desc}`).join(", ");
        finalVal = itensCesta.reduce((acc, i) => acc + (i.val * i.qtd), 0);
        finalQtd = itensCesta.reduce((acc, i) => acc + i.qtd, 0);
    }
    if(!finalVal || finalVal <= 0) return showToast("Valor zerado!", "error");

    const pl = {
        name: document.getElementById("f_nome").value,
        phone: document.getElementById("f_tel").value.replace(/\D/g,""),
        amount: finalVal,
        qtd: finalQtd,
        recebidoPor: document.getElementById("f_recebido").value,
        description: finalDesc,
        product: finalDesc,
        forma: document.getElementById("f_forma").value,
        paid: document.getElementById("f_type").value === "ENTRADA"
    };

    if(abaAtiva==="admin") await apiPost("criarAdmin", {...pl, type: document.getElementById("f_type").value});
    
    if(abaAtiva==="ejc" || abaAtiva==="mercadinho") {
        if(!pl.recebidoPor) return showToast("Informe quem recebeu!", "error");
        if (abaAtiva === "ejc") {
            const dia = document.getElementById("f_dia").value;
            if(dia === "Domingo" && pl.paid === false) return showToast("Domingo não pode fiado!", "error");
            pl.equipe = document.getElementById("f_equipe").value;
            if (!pl.equipe) return showToast("Selecione a Equipe", "error");
            pl.category="EJC"; pl.day=dia;
        }
        if (abaAtiva === "mercadinho") {
            pl.category = "Mercadinho"; 
            const tipoPessoa = document.getElementById("f_tipo_pessoa").value;
            if (tipoPessoa === "PAROQUIANO") {
                if (pl.paid === false) return showToast("Paroquiano não pode fiado!", "error");
                pl.equipe = ""; 
            } else {
                pl.equipe = document.getElementById("f_equipe_merc").value;
                if (!pl.equipe) return showToast("Informe equipe do Servo", "error");
            }
            const cp = document.getElementById("f_campanha").value; 
            if(cp === "MAES") pl.product = "[MÃES] " + pl.product;
            if(cp === "NAMORADOS") pl.product = "[NAMORADOS] " + pl.product;
        }
        await apiPost("criarVendaCompras", pl);
    }
    
    if(abaAtiva==="feijoada") {
        delete pl.day; 
        pl.qtd = document.getElementById("f_qtd").value;
        pl.comunidade = document.getElementById("f_comun").value;
        pl.obs = document.getElementById("f_obs").value; 
        pl.equipe = document.getElementById("f_equipe_feijoada").value;
        await apiPost("criarFeijoada", pl);
    }
    fecharModal(); 
});

async function apiPost(act, pl){
    document.getElementById("loading").classList.remove("hidden");
    await fetch(API, { method:"POST", body:JSON.stringify({action:act, payload:pl}) });
    showToast("Salvo com sucesso!");
    carregar();
}

function abrirModal(){ 
    document.getElementById("modal").classList.remove("hidden"); 
    limparCesta();
    document.getElementById("blocoTroco").classList.add("hidden");
    document.getElementById("f_pago").value = "";
    document.getElementById("txtTroco").innerText = "Troco: R$ 0,00";
    document.getElementById("camposEJC").classList.toggle("hidden", abaAtiva!=="ejc"); 
    document.getElementById("camposMercado").classList.toggle("hidden", abaAtiva!=="mercadinho"); 
    document.getElementById("camposFeijoada").classList.toggle("hidden", abaAtiva!=="feijoada"); 
    if(abaAtiva==="mercadinho") controlarTipoPessoa();
}

function fecharModal(){ document.getElementById("modal").classList.add("hidden"); limparCesta(); document.getElementById("formFin").reset(); }

async function baixar(id) {
    if(!confirm("Recebeu o valor?")) return;
    document.getElementById("row-"+id).remove();
    let abaEnvio = abaAtiva==="admin" ? "ADMIN" : abaAtiva==="feijoada" ? "FEIJOADA" : "COMPRAS";
    await apiPost("marcarPago", {id:id, aba: abaEnvio});
}

async function arquivar(cat, fil){ if(confirm("Arquivar e limpar?")) await apiPost("arquivar", {category:cat, filtro:fil}); }
async function pagarTudoDomingo(){ if(confirm("Quitar todos os pendentes?")) await apiPost("pagarLote", {ids: dadosCache.filter(i=>!i.paid && i.category!=="Feijoada").map(i=>i.id)}); }

async function arquivarInd(id) {
    if(!confirm("Mover este item para o Arquivo Morto?")) return;
    document.getElementById("row-"+id).remove();
    let abaEnvio = abaAtiva==="admin" ? "ADMIN" : abaAtiva==="feijoada" ? "FEIJOADA" : "COMPRAS";
    await apiPost("arquivarTransacao", {id:id, aba: abaEnvio});
}

function calcularDividaPorTelefone(tel) {
    const cleanTel = String(tel).replace(/\D/g, "");
    return dadosCache.filter(i => !i.paid && String(i.phone).replace(/\D/g, "") === cleanTel && i.category === "EJC").reduce((soma, i) => soma + parseFloat(i.amount || i.total || 0), 0);
}

function cobrarZapTotal(tel, nome){
    const num = String(tel).replace(/\D/g,"");
    if(!/^\d{10,11}$/.test(num)) return showToast("Número inválido", "error");
    const total = calcularDividaPorTelefone(num);
    const valorCobrar = total > 0 ? total : parseFloat(0);
    let cob = prompt("Seu nome?",""); if(!cob) return;
    const msg = encodeURIComponent(`Olá *${nome.split(' ')[0]}*! Aqui é *${cob}* do EJC.\nConsta um total pendente de *R$ ${valorCobrar.toFixed(2)}* referente aos itens consumidos.\nQuando puder, pode passar no caixa para regularizar?\nDeus abençoe! ✝️`);
    window.open(`https://wa.me/55${num}?text=${msg}`);
}

function exportarExcel(){ alert("Use o PC"); }
function exportarPDF(){ alert("Use o PC"); }
function copiarRelatorioCobranca(){ 
    const l = dadosCache.filter(i=>!i.paid && i.category!=="Feijoada").map(i=>`🔴 ${i.buyer_name}: R$ ${parseFloat(i.amount || i.total || 0).toFixed(2)}`).join("\n");
    navigator.clipboard.writeText("*COBRANÇA DOMINGO*\n"+l).then(()=>showToast("Copiado!"));
}

function sair(){ location.reload(); }
</script>

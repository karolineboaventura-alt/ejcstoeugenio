<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EJC • Lista de Providência</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"/>

  <style>

    body{
      font-family:"Plus Jakarta Sans",sans-serif;
      background:#f8fafc;
    }

    .card{
      background:white;
      border-radius:28px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    .hero{
      background:linear-gradient(135deg,#820ad1,#4b0082);
      color:white;
      border-radius:28px;
    }

    .item-card{
      background:white;
      border-radius:22px;
      border:1px solid #eee;
      box-shadow:0 5px 20px rgba(0,0,0,.05);
    }

    .progress{
      height:8px;
      background:#ececec;
      border-radius:999px;
      overflow:hidden;
    }

    .progress-fill{
      height:100%;
      background:linear-gradient(90deg,#820ad1,#a855f7);
    }

    .choose{
      background:#820ad1;
      color:white;
      border-radius:14px;
      padding:10px 14px;
      font-size:11px;
      font-weight:800;
      text-transform:uppercase;
    }

    .input{
      width:100%;
      padding:15px;
      border-radius:18px;
      border:2px solid #edf2f7;
      font-weight:700;
    }

    .input:focus{
      outline:none;
      border-color:#820ad1;
    }

  </style>
</head>

<body class="p-4">

<div class="max-w-md mx-auto space-y-5">

  <div class="hero p-6 text-center">

    <div class="text-4xl mb-3">
      ✝️
    </div>

    <p class="text-[11px] uppercase tracking-[0.2em] font-black text-white/70">
      EJC • Paróquia Santo Eugênio
    </p>

    <h1 class="text-2xl font-black mt-2">
      Lista de Providência
    </h1>

    <p class="text-sm text-white/70 mt-2 italic">
      "A morte não venceu!"
    </p>

  </div>

  <div class="card p-5">

    <div class="flex justify-between items-center mb-4">

      <div>
        <p class="text-xs uppercase font-black text-slate-400">
          Necessidades
        </p>

        <h2 class="text-lg font-black text-slate-800">
          Itens pendentes
        </h2>
      </div>

      <span id="totalPendentes"
        class="bg-purple-50 text-purple-700 px-3 py-1 rounded-full text-xs font-black">
        --
      </span>

    </div>

    <div id="areaItens" class="space-y-4">

      <p class="text-center text-slate-400 text-sm py-8">
        Carregando itens...
      </p>

    </div>

  </div>

  <div id="areaForm"
    class="card p-5 hidden">

    <h2 class="text-lg font-black text-slate-800 mb-4">
      Confirmar providência 💜
    </h2>

    <div id="itensSelecionados"
      class="space-y-2 mb-5">
    </div>

    <form
      onsubmit="event.preventDefault(); submeterDoacao();"
      class="space-y-4">

      <input
        id="d_nome"
        class="input"
        placeholder="Seu nome"
        required/>

      <input
        id="d_tel"
        class="input"
        placeholder="WhatsApp"
        required/>

      <select
        id="d_equipe"
        class="input"
        required>

        <option value="">
          Sua equipe...
        </option>

        <option value="Externo">
          Externo
        </option>

        <option>
          Cozinha
        </option>

        <option>
          Liturgia
        </option>

        <option>
          Ordem
        </option>

      </select>

      <input
        id="d_data"
        type="date"
        class="input"
        required/>

      <button
        class="w-full bg-purple-700 text-white py-4 rounded-2xl font-black uppercase">

        Confirmar Providência

      </button>

    </form>

  </div>

</div>

<script>

const SUPABASE_URL =
'https://ilzgmueeblxeyieumpyk.supabase.co';

const SUPABASE_KEY =
'sb_publishable_zDZyZ2_2KVeAD63XOon3mw_QOOQoRHf';

const _supabase =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let carrinho = [];

function esc(s){
  return String(s || "")
    .replace(/[&<>'"]/g, t => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[t]));
}

function prioridadeInfo(item){

  const n =
    String(item || "").toLowerCase();

  if([
    "carne",
    "frango",
    "arroz",
    "feijão",
    "agua",
    "água"
  ].some(x => n.includes(x))){

    return {
      label:"🔴 Prioridade alta",
      classe:"bg-rose-50 text-rose-700 border-rose-100"
    };
  }

  if([
    "óleo",
    "oleo",
    "café",
    "cafe",
    "sal"
  ].some(x => n.includes(x))){

    return {
      label:"🟠 Importante",
      classe:"bg-orange-50 text-orange-700 border-orange-100"
    };
  }

  return {
    label:"🟢 Apoio",
    classe:"bg-emerald-50 text-emerald-700 border-emerald-100"
  };
}

function categorizar(item){

  const n =
    String(item || "").toLowerCase();

  if([
    "carne",
    "frango",
    "linguiça"
  ].some(x => n.includes(x))){
    return "🍖 Proteínas";
  }

  if([
    "arroz",
    "feijão",
    "feijao"
  ].some(x => n.includes(x))){
    return "🍚 Alimentação";
  }

  if([
    "detergente",
    "sabão",
    "sabao"
  ].some(x => n.includes(x))){
    return "🧼 Limpeza";
  }

  return "💜 Outros";
}

async function carregarDados(){

  const wrap =
    document.getElementById(
      "areaItens"
    );

  wrap.innerHTML = `
    <p class="text-center text-slate-400 text-sm py-8">
      Carregando itens...
    </p>
  `;

  const { data: metas, error: erroMetas } =
    await _supabase
      .from("metas_providencia")
      .select("*");

  if(erroMetas){

    console.error(erroMetas);

    wrap.innerHTML = `
      <p class="text-center text-rose-500 text-sm py-8">
        Erro ao carregar metas.
      </p>
    `;

    return;
  }

  const { data: doacoes } =
    await _supabase
      .from("doacao")
      .select("item, quantidade, status");

  const mapa = {};

  (doacoes || []).forEach(d => {

    const status =
      String(d.status || "")
      .toUpperCase();

    if(![
      "PROMETIDO",
      "PENDENTE",
      "ENTREGUE",
      "PAGO"
    ].includes(status)) return;

    const key =
      String(d.item || "")
      .trim()
      .toLowerCase();

    mapa[key] =
      (mapa[key] || 0)
      + Number(d.quantidade || 0);

  });

  const grupos = {
    "🔴 Prioridade alta":[],
    "🟠 Importante":[],
    "🟢 Apoio":[]
  };

  (metas || []).forEach(m => {

    const item =
      String(m.item || "").trim();

    if(!item) return;

    const key =
      item.toLowerCase();

    const alvo =
      Number(m.quantidade_alvo || 0);

    const recebido =
      mapa[key] || 0;

    const falta =
      alvo <= 0
        ? 1
        : Math.max(0, alvo - recebido);

    const perc =
      alvo > 0
        ? Math.min(
            100,
            Math.round(
              (recebido / alvo) * 100
            )
          )
        : 0;

    if(alvo > 0 && falta <= 0){
      return;
    }

    const prio =
      prioridadeInfo(item);

    grupos[prio.label].push({
      item,
      unidade:m.unidade || "un",
      alvo,
      recebido,
      falta,
      perc,
      prio,
      categoria:categorizar(item)
    });

  });

  wrap.innerHTML = "";

  let total = 0;

  Object.entries(grupos)
    .forEach(([titulo,itens]) => {

    if(!itens.length) return;

    total += itens.length;

    const bloco =
      document.createElement("div");

    bloco.className =
      "space-y-3";

    bloco.innerHTML = `

      <div class="flex items-center gap-2 px-1">

        <div class="font-black text-sm text-slate-800">
          ${titulo}
        </div>

        <div class="text-xs text-slate-400 font-bold">
          (${itens.length})
        </div>

      </div>

      ${itens.map(m => `

        <div class="item-card p-4">

          <div class="flex justify-between gap-3">

            <div class="flex-1">

              <div class="flex flex-wrap gap-2 mb-2">

                <span class="text-[9px] font-black px-2 py-1 rounded-full border ${m.prio.classe}">
                  ${m.prio.label}
                </span>

                <span class="text-[9px] font-black px-2 py-1 rounded-full bg-purple-50 text-purple-700 border border-purple-100">
                  ${m.categoria}
                </span>

              </div>

              <p class="text-sm font-black text-slate-800">
                ${esc(m.item)}
              </p>

              <p class="text-[11px] text-slate-400 font-bold mt-1">

                Faltam
                ${m.falta}
                ${esc(m.unidade)}

                •

                Recebido
                ${m.recebido}/${m.alvo}

              </p>

              <div class="progress mt-3">

                <div class="progress-fill"
                  style="width:${m.perc}%">
                </div>

              </div>

            </div>

            <button
              class="choose"
              onclick='selecionarItem(
                ${JSON.stringify(m.item)},
                ${JSON.stringify(m.unidade)},
                ${m.falta}
              )'>

              Escolher

            </button>

          </div>

        </div>

      `).join("")}

    `;

    wrap.appendChild(bloco);

  });

  document.getElementById(
    "totalPendentes"
  ).innerText =
    `${total} itens`;

}

function selecionarItem(item, unidade, max){

  carrinho.push({
    item,
    unidade,
    quantidade:1,
    max
  });

  renderCarrinho();

  document
    .getElementById("areaForm")
    .classList.remove("hidden");

  document
    .getElementById("areaForm")
    .scrollIntoView({
      behavior:"smooth"
    });
}

function renderCarrinho(){

  const wrap =
    document.getElementById(
      "itensSelecionados"
    );

  wrap.innerHTML =
    carrinho.map(c => `

      <div class="bg-purple-50 border border-purple-100 rounded-2xl p-3">

        <p class="font-black text-sm text-slate-800">
          ${esc(c.item)}
        </p>

        <p class="text-xs text-purple-700 font-bold">
          ${c.quantidade}
          ${esc(c.unidade)}
        </p>

      </div>

    `).join("");
}

async function submeterDoacao(){

  const nome =
    document.getElementById("d_nome").value;

  const telefone =
    document.getElementById("d_tel").value;

  const equipe =
    document.getElementById("d_equipe").value;

  const data =
    document.getElementById("d_data").value;

  const payload =
    carrinho.map(c => ({

      nome,
      telefone,
      equipe,

      item:c.item,
      quantidade:c.quantidade,
      unidade:c.unidade,

      status:"PROMETIDO",
      data_previsao:data

    }));

  const { error } =
    await _supabase
      .from("doacao")
      .insert(payload);

  if(error){

    console.error(error);

    alert(
      "Erro ao salvar."
    );

    return;
  }

  alert(
    "Providência registrada 💜"
  );

  location.reload();
}

window.onload = () => {

  carregarDados();

  const hoje =
    new Date()
    .toISOString()
    .split("T")[0];

  document
    .getElementById("d_data")
    .setAttribute("min", hoje);
};

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Providência • EJC</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { font-family: sans-serif; background:#f8fafc; }
.card { background:white; border-radius:20px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,0.05);}
.toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#111; color:white; padding:12px 16px; border-radius:12px;}
</style>
</head>

<body class="p-4 flex justify-center">

<div class="card w-full max-w-md">

<h1 class="text-xl font-bold mb-4">✝️ Lista de Providência</h1>

<form id="formDoacao" class="space-y-3">

<input id="d_nome" placeholder="Seu nome" class="w-full border p-3 rounded-xl" required>

<input id="d_tel" placeholder="WhatsApp" class="w-full border p-3 rounded-xl" required>

<select id="d_equipe" class="w-full border p-3 rounded-xl" required>
<option value="">Equipe</option>
<option>Animação</option>
<option>Cozinha</option>
<option>Compras</option>
</select>

<select id="d_item" class="w-full border p-3 rounded-xl" required></select>

<input id="d_qtd" type="number" value="1" min="1" class="w-full border p-3 rounded-xl">

<input id="d_data" type="date" class="w-full border p-3 rounded-xl" required>

<button id="btnEnviar" class="w-full bg-purple-600 text-white p-4 rounded-xl font-bold">
Confirmar Doação
</button>

</form>

<h2 id="agradecimentoTitulo" class="text-center mt-6 font-bold"></h2>

<div id="listaProgresso" class="mt-6 text-sm"></div>

</div>

<div id="toast-container"></div>

<script>
const SUPABASE_URL = 'https://sfxlfkfjqaemjotsedep.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cMEBXmudaJN7pALr1aV9-g_EPwoTfiB';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let disponibilidadeItens = {};

function showToast(msg, type="success"){
  const t = document.createElement("div");
  t.className="toast";
  t.innerText = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

async function carregarDados(){

const { data: metas } = await _supabase.from('metas_doacao').select('*');
const { data: regs } = await _supabase.from('transacoes').select('*').eq('modulo','DOACAO');

const mapa = {};

(regs||[]).forEach(r=>{
if(!mapa[r.descricao]) mapa[r.descricao]={p:0,e:0};
if(r.status==="PENDENTE") mapa[r.descricao].p+=r.quantidade;
if(r.status==="PAGO") mapa[r.descricao].e+=r.quantidade;
});

const select = document.getElementById("d_item");
select.innerHTML="<option value=''>Escolha...</option>";

(metas||[]).forEach(m=>{
const p = mapa[m.item]?.p||0;
const e = mapa[m.item]?.e||0;
const disp = m.qtd_necessaria - p - e;

disponibilidadeItens[m.item]={disponivelPrometer:disp};

if(disp>0){
const opt=document.createElement("option");
opt.value=m.item;
opt.textContent=`${m.item} (disponível: ${disp})`;
select.appendChild(opt);
}
});

}
</script>

<!-- TRECHO PRINCIPAL ALTERADO (toast com nome) -->
<script>
document.getElementById("formDoacao").addEventListener("submit", async function(e) {
  e.preventDefault();

  const btn = document.getElementById("btnEnviar");
  const textoOriginal = btn.innerHTML;

  const qtd = parseInt(document.getElementById("d_qtd").value, 10);
  const item = document.getElementById("d_item").value;
  const nome = document.getElementById("d_nome").value.trim();
  const telefone = document.getElementById("d_tel").value.replace(/\D/g, "");
  const equipe = document.getElementById("d_equipe").value;
  const dataEntrega = document.getElementById("d_data").value;

  if (!Number.isInteger(qtd) || qtd <= 0) {
    return showToast("Informe uma quantidade válida.", "error");
  }

  if (!item || !nome || !equipe || !dataEntrega) {
    return showToast("Preencha todos os campos corretamente.", "error");
  }

  if (!/^\d{10,11}$/.test(telefone)) {
    return showToast("WhatsApp inválido.", "error");
  }

  const infoItem = disponibilidadeItens[item];
  const maxDisponivel = infoItem?.disponivelPrometer ?? 0;

  if (qtd > maxDisponivel) {
    return showToast(`Para este item, o máximo disponível agora é ${maxDisponivel}.`, "error");
  }

  btn.innerHTML = "Processando...";
  btn.disabled = true;

  const { error } = await _supabase.rpc('registrar_doacao_publica', {
    p_item: item,
    p_quantidade: qtd,
    p_nome: nome,
    p_telefone: telefone,
    p_equipe: equipe,
    p_data_entrega: dataEntrega
  });

  if (error) {
    showToast("Erro ao registrar doação.", "error");
    btn.disabled = false;
    btn.innerHTML = textoOriginal;
    return;
  }

  document.getElementById("agradecimentoTitulo").innerText = `Deus lhe pague, ${nome}!`;

  showToast(`Doação registrada com sucesso, ${nome}!`);

  btn.disabled = false;
  btn.innerHTML = textoOriginal;

  await carregarDados();
});
</script>

<script>
window.onload = carregarDados;
</script>

</body>
</html>

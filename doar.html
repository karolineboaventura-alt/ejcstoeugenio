<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>21º EJC • Lista de Providência</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>

  <style>
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background: linear-gradient(180deg,#faf7ff,#f8fafc);
    }
    .card {
      background:white;
      border-radius:28px;
      box-shadow:0 20px 50px rgba(0,0,0,0.08);
    }
    .input {
      background:#f8fafc;
      border:2px solid #eef2f7;
    }
    .input:focus {
      border-color:#820ad1;
      outline:none;
      background:white;
    }
  </style>
</head>

<body class="p-4 flex justify-center">

<div class="w-full max-w-md card p-6">

  <h1 class="text-2xl font-black text-center mb-2">
    Lista de Providência
  </h1>

  <p class="text-center text-sm text-gray-500 mb-6">
    Sua ajuda é a providência de Deus ✝️
  </p>

  <!-- CONTAGEM -->
  <div class="text-center mb-6">
    <div id="countdown" class="text-lg font-bold text-purple-700"></div>
  </div>

  <!-- PROGRESSO -->
  <div id="lista" class="space-y-3 mb-6 text-sm"></div>

  <!-- ÚLTIMAS -->
  <div class="mb-6">
    <p class="text-xs font-bold text-gray-400 mb-2">Últimas ofertas</p>
    <div id="ultimas" class="text-sm"></div>
  </div>

  <!-- FORM -->
  <form id="form" class="space-y-3">

    <input id="nome" placeholder="Nome completo" class="input w-full p-3 rounded-xl" required />

    <input id="tel" placeholder="WhatsApp" class="input w-full p-3 rounded-xl" required />

    <select id="item" class="input w-full p-3 rounded-xl" required></select>

    <input id="qtd" type="number" value="1" min="1" class="input w-full p-3 rounded-xl" required />

    <input id="data" type="date" class="input w-full p-3 rounded-xl" required />

    <button class="w-full bg-purple-700 text-white p-4 rounded-xl font-bold hover:bg-purple-800 transition">
      Confirmar Oferta
    </button>

  </form>

</div>

<script>
const supabase = window.supabase.createClient(
  "https://sfxlfkfjqaemjotsedep.supabase.co",
  "sb_publishable_cMEBXmudaJN7pALr1aV9-g_EPwoTfiB"
);

// CONTAGEM REGRESSIVA
function countdown(){
  const alvo = new Date("2026-07-11T06:00:00-03:00");
  const agora = new Date();
  const diff = alvo - agora;

  if(diff <= 0){
    document.getElementById("countdown").innerText = "O encontro começou!";
    return;
  }

  const dias = Math.floor(diff/(1000*60*60*24));
  const horas = Math.floor((diff/(1000*60*60)) % 24);

  document.getElementById("countdown").innerText =
    `Faltam ${dias} dias e ${horas}h para o encontro`;
}
setInterval(countdown,1000);
countdown();

// CARREGAR METAS
async function carregar(){
  const {data} = await supabase.from("metas_doacao").select("*");

  const lista = document.getElementById("lista");
  const select = document.getElementById("item");

  lista.innerHTML="";
  select.innerHTML='<option value="">Escolha um item</option>';

  data.forEach(i=>{
    const arr = i.qtd_arrecadada || 0;
    const nec = i.qtd_necessaria || 0;

    lista.innerHTML += `
      <div class="flex justify-between">
        <span>${i.item}</span>
        <span>${arr}/${nec}</span>
      </div>
    `;

    if(arr < nec){
      const opt = document.createElement("option");
      opt.value = i.item;
      opt.textContent = `${i.item} (faltam ${nec-arr})`;
      select.appendChild(opt);
    }
  });
}

// ÚLTIMAS OFERTAS
async function ultimas(){
  const {data} = await supabase
    .from("transacoes")
    .select("*")
    .eq("modulo","DOACAO")
    .order("id",{ascending:false})
    .limit(5);

  const div = document.getElementById("ultimas");
  div.innerHTML="";

  if(!data || data.length===0){
    div.innerHTML = `<div class="text-gray-400 text-xs">Ainda não há ofertas</div>`;
    return;
  }

  data.forEach(d=>{
    const nome = (d.nome_pessoa || "Alguém").split(" ")[0];
    div.innerHTML += `
      <div class="mb-1">
        <b>${nome}</b> ofertou ${d.quantidade} ${d.descricao}
      </div>
    `;
  });
}

// ENVIO
document.getElementById("form").addEventListener("submit", async e=>{
  e.preventDefault();

  const btn = e.target.querySelector("button");
  btn.innerText = "Enviando...";
  btn.disabled = true;

  const {error} = await supabase.rpc("registrar_doacao_publica",{
    p_item:document.getElementById("item").value,
    p_quantidade:parseInt(document.getElementById("qtd").value),
    p_nome:document.getElementById("nome").value,
    p_telefone:document.getElementById("tel").value,
    p_equipe:"Externo",
    p_data_entrega:document.getElementById("data").value
  });

  if(error){
    alert("Erro ao registrar.");
    btn.innerText = "Confirmar Oferta";
    btn.disabled = false;
    return;
  }

  alert("Oferta registrada com sucesso! Deus lhe pague! ✝️");
  location.reload();
});

carregar();
ultimas();
</script>

</body>
</html>

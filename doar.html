<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#820ad1" />
  <title>EJC • Lista de Providência</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root { --brand: #820ad1; --bg: #f8fafc; --text: #1f2937; }
    body { font-family: "Plus Jakarta Sans", sans-serif; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
    .page-shell { background: rgba(255,255,255,0.97); border-radius: 36px; box-shadow: 0 24px 60px -24px rgba(15, 23, 42, 0.18); border: 1px solid #f1f5f9; }
    .hero-top { background: linear-gradient(135deg, #820ad1 0%, #4b0082 100%); border-radius: 30px; }
    .vault-input { width: 100%; background: #f8fafc; border: 2px solid #eef2f7; transition: all .25s ease; border-radius: 16px; padding: 12px 16px; font-weight: 700; }
    .vault-input:focus { outline: none; border-color: var(--brand); background: white; }
    .category-card { background: white; border: 1px solid #f1f5f9; border-radius: 24px; overflow: hidden; margin-bottom: 12px; shadow-sm; }
    .item-row { border-top: 1px solid #f8fafc; padding: 12px 16px; transition: background 0.2s; cursor: pointer; }
    .item-row:active { background: #f5f3ff; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 16px; border-radius: 16px; color: white; font-weight: 800; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    
    /* Estilo do Acordeão */
    details summary::-webkit-details-marker { display:none; }
    summary { list-style: none; display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 py-8">

  <div id="toast-container"></div>

  <div class="w-full max-w-md page-shell p-5">
    
    <div class="hero-top p-6 text-white mb-6 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-white/20 rounded-xl mb-3 text-2xl">✝️</div>
      <h1 class="text-xl font-black">Lista de Providência</h1>
      <p class="text-[10px] font-bold opacity-70 mt-1 uppercase tracking-widest">21º EJC Santo Eugênio</p>
    </div>

    <div class="bg-purple-50 border border-purple-100 p-4 rounded-3xl mb-6">
      <p class="text-xs font-extrabold text-purple-900 mb-1 italic text-center">"A morte não venceu! 💜"</p>
      <p class="text-[10px] text-purple-700 text-center">Clique nas categorias abaixo para escolher sua doação.</p>
    </div>

    <div id="areaItens" class="space-y-3 mb-8">
       <p class="text-center text-slate-400 text-xs py-10">Buscando necessidades...</p>
    </div>

    <div id="areaForm" class="hidden bg-white rounded-[32px] p-6 border-2 border-purple-100 shadow-xl animate-elite">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-black text-slate-800 uppercase text-sm">Sua Lista</h2>
        <button onclick="fecharForm()" class="text-slate-300 text-xs font-bold underline">Cancelar</button>
      </div>

      <div id="itensSelecionados" class="space-y-2 mb-6"></div>

      <form id="formDoacao" onsubmit="event.preventDefault(); submeterDoacao();" class="space-y-4">
        <input id="d_nome" placeholder="Seu nome completo" required class="vault-input" />
        <input id="d_tel" type="tel" placeholder="WhatsApp com DDD" required class="vault-input" />
        
        <select id="d_equipe" required class="vault-input bg-white">
          <option value="">Sua Equipe...</option>
          <option value="Externo">Paroquiano / Visitante</option>
          <option>Animação</option>
          <option>Apoio ao Patrimônio</option>
          <option>Café</option>
          <option>Círculo</option>
          <option>Compras</option>
          <option>Cozinha</option>
          <option>Intercessão</option>
          <option>Liturgia</option>
          <option>Ordem</option>
          <option>Piloto</option>
          <option>Sala</option>
          <option>Secretaria</option>
          <option>Som e Iluminação</option>
          <option>Trânsito</option>
          <option>Visitação</option>
        </select>

        <div class="space-y-1">
          <label class="text-[9px] font-black text-slate-400 uppercase ml-1">Previsão de Entrega</label>
          <input id="d_data" type="date" required class="vault-input" />
        </div>

        <button type="submit" id="btnEnviar" class="w-full bg-purple-700 text-white py-5 rounded-2xl font-black shadow-lg uppercase text-sm active:scale-95 transition-all">
          Confirmar Providência 💜
        </button>
      </form>
    </div>

    <div id="sucesso" class="hidden text-center p-8 bg-emerald-50 rounded-[32px] border border-emerald-100">
      <div class="text-4xl mb-4">🙏</div>
      <h3 class="text-xl font-black text-slate-800">Deus lhe pague!</h3>
      <p class="text-sm text-slate-600 mt-2">Sua doação foi registrada. Nos vemos no EJC!</p>
      <button onclick="location.reload()" class="mt-6 bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold uppercase text-xs">Voltar à lista</button>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://ilzgmueeblxeyieumpyk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_zDZyZ2_2KVeAD63XOon3mw_QOOQoRHf';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let carrinho = [];
    let metasOriginais = [];

    function showToast(m, type="success"){
      const t = document.createElement("div");
      t.className = `toast ${type === 'error' ? 'bg-rose-600' : 'bg-slate-900'}`;
      t.innerText = m;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 3500);
    }

    async function carregarDados(){
      const { data: metas } = await _supabase.from('metas_providencia').select('*');
      const { data: doacoes } = await _supabase.from('doacao').select('item, quantidade').in('status', ['PROMETIDO', 'ENTREGUE']);
      
      metasOriginais = metas || [];
      const mapaRec = {};
      doacoes?.forEach(d => { mapaRec[d.item.toLowerCase()] = (mapaRec[d.item.toLowerCase()] || 0) + Number(d.quantidade); });

      const grupos = {
        "🔴 CRÍTICOS (Proteínas e Água)": [],
        "🟠 ALIMENTAÇÃO (Não Perecíveis)": [],
        "🥬 HORTIFRUTI (Perecíveis)": [],
        "🧼 LIMPEZA E HIGIENE": [],
        "📦 DESCARTÁVEIS E PAPELARIA": [],
        "🟢 DE BOA": []
      };

      metas.forEach(m => {
        const n = m.item.toLowerCase();
        const rec = mapaRec[n] || 0;
        const falta = Math.max(0, m.quantidade_alvo - rec);
        const perc = m.quantidade_alvo > 0 ? (rec / m.quantidade_alvo) * 100 : 0;

        if (falta <= 0) return; // Esconde o que já está 100%

        const itemObj = { ...m, falta, perc };

        if (['água','agua','carne','frango','linguiça','bacon','mussarela','presunto'].some(x => n.includes(x))) grupos["🔴 CRÍTICOS (Proteínas e Água)"].push(itemObj);
        else if (['arroz','feijão','feijao','óleo','oleo','leite','café','cafe','açúcar','acucar'].some(x => n.includes(x))) grupos["🟠 ALIMENTAÇÃO (Não Perecíveis)"].push(itemObj);
        else if (['batata','cebola','alho','cenoura','limão','fruta','banana','maçã'].some(x => n.includes(x))) grupos["🥬 HORTIFRUTI (Perecíveis)"].push(itemObj);
        else if (['detergente','desinfetante','cândida','sabão','papel higiênico'].some(x => n.includes(x))) grupos["🧼 LIMPEZA E HIGIENE"].push(itemObj);
        else if (['copo','guardanapo','alumínio','sulfite','saco de lixo'].some(x => n.includes(x))) grupos["📦 DESCARTÁVEIS E PAPELARIA"].push(itemObj);
        else grupos["🟢 DE BOA"].push(itemObj);
      });

      const wrap = document.getElementById('areaItens');
      wrap.innerHTML = "";

      Object.entries(grupos).forEach(([titulo, itens]) => {
        if (itens.length === 0) return;
        
        const details = document.createElement("details");
        details.className = "category-card shadow-sm";
        
        const summary = document.createElement("summary");
        summary.innerHTML = `<span>${titulo}</span> <i class="fas fa-chevron-down text-slate-300"></i>`;
        
        const content = document.createElement("div");
        content.className = "divide-y divide-slate-50 pb-2";
        content.innerHTML = itens.map(m => `
          <div class="item-row flex justify-between items-center" onclick="pedirQtd('${m.item}', '${m.unidade}', ${m.falta})">
            <div>
              <p class="text-sm font-bold text-slate-700 capitalize">${m.item}</p>
              <p class="text-[10px] font-black text-purple-500 uppercase">Faltam ${m.falta} ${m.unidade}</p>
            </div>
            <div class="w-8 h-8 rounded-full bg-purple-50 flex items-center justify-center text-purple-600">
              <i class="fas fa-plus text-xs"></i>
            </div>
          </div>
        `).join("");

        details.appendChild(summary);
        details.appendChild(content);
        wrap.appendChild(details);
      });
    }

    function pedirQtd(item, un, max) {
      const qtd = prompt(`Quantas unidades (${un}) você deseja doar? (Máximo sugerido: ${max})`, "1");
      if (qtd === null) return;
      const num = parseInt(qtd);
      if (isNaN(num) || num <= 0) return showToast("Quantidade inválida", "error");

      carrinho.push({ item, quantidade: num, unidade: un });
      abrirForm();
    }

    function abrirForm() {
      document.getElementById('areaItens').classList.add('hidden');
      document.getElementById('areaForm').classList.remove('hidden');
      renderCarrinho();
    }

    function fecharForm() {
      document.getElementById('areaItens').classList.remove('hidden');
      document.getElementById('areaForm').classList.add('hidden');
    }

    function renderCarrinho() {
      const list = document.getElementById('itensSelecionados');
      list.innerHTML = carrinho.map((c, i) => `
        <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl border border-slate-100">
          <span class="text-xs font-bold text-slate-700">${c.quantidade} ${c.unidade} de ${c.item}</span>
          <button onclick="carrinho.splice(${i},1); carrinho.length === 0 ? fecharForm() : renderCarrinho()" class="text-rose-500 text-[10px] font-black uppercase">Remover</button>
        </div>
      `).join("");
    }

    async function submeterDoacao(){
      const btn = document.getElementById('btnEnviar');
      const nome = document.getElementById('d_nome').value;
      const tel = document.getElementById('d_tel').value;
      const equipe = document.getElementById('d_equipe').value;
      const dataP = document.getElementById('d_data').value;

      if(!nome || !tel || !equipe || !dataP) return showToast("Preencha todos os campos!", "error");

      btn.disabled = true;
      btn.innerText = "Salvando...";

      const doacoes = carrinho.map(c => ({
        nome, telefone: tel, equipe, item: c.item, quantidade: c.quantidade, unidade: c.unidade,
        data_previsao: dataP, status: "PROMETIDO", tipo: "PENDENTE", tipo_pessoa: equipe === "Externo" ? "PAROQUIANO" : "SERVO",
        data_movimento: new Date().toISOString().split('T')[0], responsavel_lanc: "Lista Pública"
      }));

      const { error } = await _supabase.from('doacao').insert(doacoes);

      if(error) {
        console.error(error);
        showToast("Falha na comunicação. Tente novamente.", "error");
        btn.disabled = false;
        btn.innerText = "Confirmar Providência 💜";
      } else {
        document.getElementById('areaForm').classList.add('hidden');
        document.getElementById('sucesso').classList.remove('hidden');
        window.scrollTo(0,0);
      }
    }

    window.onload = () => {
      carregarDados();
      const hoje = new Date().toISOString().split('T')[0];
      document.getElementById('d_data').setAttribute('min', hoje);
    };
  </script>
</body>
</html>
